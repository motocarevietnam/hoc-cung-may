; /etc/php/8.X/fpm/pool.d/hoc-cung-may.conf   (8.X = phiên bản PHP trên VPS, xem bằng: ls /etc/php)
; Pool riêng, chạy bằng user "may", tách khỏi website pho88.
[hoc-cung-may]
user = may
group = may
listen = /run/php/hoc-cung-may.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 120s

; Chỉ được đọc/ghi trong thư mục của Mây
php_admin_value[open_basedir] = /var/www/hoc-cung-may/:/tmp/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/hoc-cung-may/php-error.log
php_admin_value[memory_limit] = 64M
php_admin_value[max_execution_time] = 120
