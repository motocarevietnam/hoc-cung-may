# /etc/nginx/sites-available/hoc-cung-may
# Thay may.TEN-MIEN-CUA-BAN.vn bằng tên miền phụ thật. HTTPS sẽ do certbot tự thêm vào.
server {
    listen 80;
    listen [::]:80;
    server_name may.TEN-MIEN-CUA-BAN.vn;

    root /var/www/hoc-cung-may/public;
    index index.html;
    client_max_body_size 64k;

    access_log /var/log/nginx/hoc-cung-may.access.log;
    error_log  /var/log/nginx/hoc-cung-may.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    # Mọi yêu cầu /api/... đi vào api.php qua pool PHP-FPM riêng của Mây
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/hoc-cung-may.sock;
        fastcgi_read_timeout 120s;
    }

    # Chấm bài tập: nhận tối đa 4 ảnh (đã thu nhỏ trên iPad), nên cho phép gửi lớn hơn
    location ~ ^/api/(homework|write_submit|speak_pron|read_pron)$ {
        client_max_body_size 10m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/hoc-cung-may.sock;
        fastcgi_read_timeout 150s;
    }

    # Không cho chạy hay tải trực tiếp bất kỳ file .php nào khác
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }

    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Cổng ba mẹ: cùng giao diện, chạy ở chế độ ba mẹ
    location ^~ /parents/ { try_files $uri /index.html; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
