}
function ttClose(){ document.getElementById("overlayHost").innerHTML = ""; ttDraw(); }
function ttPickCell(d, i){
  const label = DAY_OPTS.find(x=>x[0]===d)[1], cur = ttEdit.cells[d][i] || "", t = ttEdit.periods[i] || "";
  const h = ttSheet(`<h3 style="margin:0 0 4px">${label} · tiết ${i+1}</h3><p class="muted" style="margin:0 0 10px">${esc(t)}</p>
    <div class="ttchips">${TT_SUBJECTS.map(x=>`<button class="chip${x===cur?" on":""}" data-s="${esc(x)}">${esc(x)}</button>`).join("")}</div>

function ttPickTime(i){
  const [a,b] = String(ttEdit.periods[i]||"").split(/\s*[-–]\s*/);
  const h = ttSheet(`<h3 style="margin:0 0 10px">Giờ của tiết ${i+1}</h3>
    <div class="row" style="margin:0;align-items:center"><input class="field" type="time" id="ttFrom" value="${esc(a||"")}" style="flex:1"> – <input class="field" type="time" id="ttTo" value="${esc(b||"")}" style="flex:1"></div>
    <div class="row" style="margin-top:12px;justify-content:space-between"><button class="btn danger" id="ttDel">Xoá tiết này</button>
      <span><button class="btn" id="ttCancel">Đóng</button> <button class="btn primary" id="ttOk">Lưu</button></span></div>`);
  h.querySelector("#ttOk").onclick=()=>{ const f=h.querySelector("#ttFrom").value, t=h.querySelector("#ttTo").value;

  h.querySelector("#ttDel").onclick=()=>{ if(!confirm("Xoá tiết "+(i+1)+" ở tất cả các ngày?")) return;
    ttEdit.periods.splice(i,1); DAY_OPTS.forEach(([d])=>ttEdit.cells[d].splice(i,1)); ttClose(); };

function renderParentPlan(){

  const editing = PP.edit ? (PP.edit==="draft" ? cur : ok) : null;
  let body = "";
  if(PP.loading) body = `<div class="greet">${mascot()}<div class="say">${esc(PP.loading)} <span class="thinking"><i></i><i></i><i></i></span><br><span class="muted">Có thể mất khoảng một phút.</span></div></div>`;
  else if(editing){
    body = `<p class="muted">${editing.status==="draft"?"Bản nháp Mây đề xuất":"Kế hoạch đang áp dụng"} · ${ddmm(editing.start_day)} – ${ddmm(editing.end_day)}/${editing.end_day.slice(0,4)}</p>
      ${editing.content.summary ? `<div class="notice">${esc(editing.content.summary)}</div>` : ""}

      ${editing.content.weeks.map(w=>`<div class="card pweek" data-start="${w.start}"><h3>Tuần ${ddmm(w.start)} – ${ddmm(new Date(new Date(w.start+"T00:00:00Z").getTime()+6*864e5).toISOString().slice(0,10))}</h3>
          ${SUBJECTS.map(s=>`<div class="prow"><span>${s.ic} ${esc(s.name)}</span><input data-k="${s.id}" value="${esc(w[s.id]||"")}"></div>`).join("")}
          <div class="prow"><span>📌 Ghi chú</span><input data-k="note" value="${esc(w.note||"")}" placeholder="Ví dụ: tuần thi giữa kỳ"></div></div>`).join("")}
      <div class="row"><button class="btn" id="planSave">Lưu</button>

        ${ok ? `<p style="margin:0">Từ ${ddmm(ok.start_day)} đến ${ddmm(ok.end_day)}/${ok.end_day.slice(0,4)}, ${ok.content.weeks.length} tuần.</p><div class="row"><button class="btn" id="editOk">Xem / sửa</button></div>`
             : `<p class="muted" style="margin:0">Chưa có. Mây sẽ tự chọn bài ôn theo thời khoá biểu.</p>`}</div>
      ${cur ? `<div class="card"><h3>Bản nháp chờ duyệt</h3><p style="margin:0">Từ ${ddmm(cur.start_day)} đến ${ddmm(cur.end_day)}/${cur.end_day.slice(0,4)}.</p><div class="row"><button class="btn primary" id="editDraft">Xem, sửa và duyệt</button></div></div>` : ""}
      <div class="card"><h3>Nhờ Mây soạn kế hoạch quý</h3>
        <p class="muted" style="margin:0">Mây soạn đề xuất 13 tuần tới cho 5 môn, theo chương trình lớp 4, bộ sách và lịch học ba mẹ đã nhập, cùng những phần bé hay sai. Ba mẹ sửa và duyệt rồi mới áp dụng.</p>
        <div class="row"><button class="btn primary" id="genPlan">${cur?"Soạn lại bản nháp":"Mây soạn kế hoạch"}</button></div></div>`;
  }
  app.innerHTML = `<button class="back" id="back">‹ Báo cáo</button><h2 style="font-size:28px">Kế hoạch học</h2>${body}`;
  document.getElementById("back").onclick=()=>{ state.parentPage=null; state.pplan=null; render(); };
  const on=(id,f)=>{ const el=document.getElementById(id); if(el) el.onclick=f; };
  on("editOk",()=>{ PP.edit="approved"; render(); });
  on("editDraft",()=>{ PP.edit="draft"; render(); });
  on("planCancel",()=>{ PP.edit=null; render(); });
  on("genPlan", async()=>{
    PP.loading="Mây đang soạn kế hoạch 13 tuần…"; PP.error=""; render();
    try{ const d = await api("/api/parent/plan_generate",{},true); PP.draft=d.draft; PP.edit="draft"; }
    catch(e){ PP.error = copyFor(e&&e.code); }

    catch(e){ msg.textContent=copyFor(e&&e.code); }
  };
  on("planSave",()=>save(false));
  on("planApprove",()=>save(true));
}

/* ---------- Google Drive (Góc ba mẹ) ---------- */
function backupHtml(B){
  if(!B) return "";
  const when = t => { const d=new Date(t*1000), z=n=>String(n).padStart(2,"0"); return `${z(d.getDate())}/${z(d.getMonth()+1)} lúc ${z(d.getHours())}:${z(d.getMinutes())}`; };
  const kb = n => Math.max(1, Math.round(n/1024)) + " KB";
  const d = B.drive_last ? `bản mới nhất ${when(B.drive_last.t)} (${kb(B.drive_last.bytes)}), đang giữ ${B.drive_count}/${B.drive_keep} bản`
          : "chưa có bản nào (tự gửi lúc 3 giờ sáng mỗi ngày)";
  return `<p class="muted" id="bInfo" style="margin:6px 0 0">💾 Sao lưu dữ liệu học vào thư mục <b>Học cùng Mây – Sao lưu</b>: ${d}.</p>`;
}

  const mb = b => (b/1048576).toFixed(1).replace(".",",") + " MB";
  card.innerHTML = `<h3>Lưu ảnh bài tập lên Google Drive</h3>
    ${!G.configured ? `<p class="muted" style="margin:0">Chưa bật. Cần điền <b>google_client_id</b> và <b>google_client_secret</b> vào config.php trên VPS. Khi chưa bật, ảnh chỉ dùng để chấm rồi bỏ, không lưu ở đâu.</p>`

        <p class="muted" style="margin:6px 0 0">Đang lưu ${G.files} ảnh, ${mb(G.bytes)}. Ảnh tự xoá khỏi Drive sau ${G.keep_days} ngày (1 năm học).</p>

        <div class="row"><button class="btn" id="gOn" title="Cấp lại quyền, giữ nguyên thư mục và ảnh đã lưu">🔄 Kết nối lại</button><button class="btn danger" id="gOff">Ngắt kết nối</button></div>`
    : `<p style="margin:0">Ảnh bài tập (đã nén trên iPad, khoảng 300 KB/trang) sẽ được lưu vào Google Drive của gia đình. Mây chỉ được quyền với các file do chính nó tạo, không xem được file khác trong Drive.</p>

async function startCheck(source, ref){
  state.ck = {phase:"loading"}; go("check");

// Ghép kết quả nhận giọng nói thành một đoạn: thêm dấu cách giữa các đoạn, bỏ các bản nháp bị lặp
// (Chrome Android hay trả "1", "1 tấn", "1 tấn bằng"… như các kết quả riêng)
function joinSR(results){
  const parts=[];
  for(let i=0;i<results.length;i++){
    const t=(results[i][0]?.transcript||"").trim(); if(!t) continue;
    const last=parts[parts.length-1], lo=t.toLowerCase();
    if(last!==undefined && lo.startsWith(last.toLowerCase())) parts[parts.length-1]=t;
    else if(last!==undefined && last.toLowerCase().startsWith(lo)) continue;
    else parts.push(t);
  }
  return parts.join(" ");
}

function renderCheck(){

  else if(C.phase==="error") body = `<div class="notice">${esc(C.error)}</div>`;
  else if(C.phase==="explain" || C.phase==="judging" || C.phase==="explained"){

      <div class="sp-big" style="font-size:20px">Bạn giải thích điều vừa ôn tập cho Mây hiểu với nha</div>

      ${C.phase!=="explained" || (r && r.verdict!=="correct" && C.tries>0) ? `
        <textarea class="field" id="ckText" rows="4" placeholder="${esc(CK_EX[C.subject]||CK_EX.toan)}">${esc(C.text||"")}</textarea>
        <div class="row">${SR?`<button class="btn" id="ckMic">${ckRec?"⏹️ Dừng":"🎤 Nói"}</button>`:""}
          <button class="btn primary" id="ckSend" ${C.phase==="judging"?"disabled":""}>${C.phase==="judging"?"Mây đang đọc…":"Gửi Mây"}</button></div>` : ""}
      ${r ? `<div class="sp-res"><div class="lv ${r.verdict==="correct"?"great":r.verdict==="incorrect"?"try_again":""}">${VERDICT[r.verdict]}</div>
        ${r.praise?`<p style="margin:6px 0">${esc(r.praise)}</p>`:""}${r.missing?`<div class="fix">${esc(r.missing)}</div>`:""}${r.tip?`<p class="muted" style="margin:6px 0 0">💡 ${esc(r.tip)}</p>`:""}</div>` : ""}
      ${C.phase==="explained" ? `<div class="row"><button class="btn primary" id="ckGoQ">Bước 2: làm 3 câu kiểm tra ›</button></div>` : ""}

  else if(C.phase==="q"){
    const q = C.qs[C.i], done = C.picked!==null && C.picked!==undefined;
    body = `<div class="dots">${C.qs.map((_,i)=>`<span class="${i<C.results.length?(C.results[i]?"ok":"no"):(i===C.i?"now":"")}"></span>`).join("")}</div>
      <div class="qcard"><div class="muted">Bước 2/2 · Câu ${C.i+1}/${C.qs.length}</div><div class="q">${fmt(q.q)}</div>
        <div class="opts">${q.options.map((o,i)=>{ let c=""; if(done){ if(i===C.ans) c="right"; else if(i===C.picked) c="wrong"; }
          return `<button class="opt ${c}" data-i="${i}" ${done?"disabled":""}>${"ABCD"[i]}. ${fmt(o)}</button>`; }).join("")}</div>
        ${done?`<div class="explain"><b>${C.picked===C.ans?"Chính xác! 🎉":"Chưa đúng, xem nè:"}</b><br>${fmt(C.exp||"")}</div>`:""}
        ${done?`<div class="row"><button class="btn primary" id="ckNext">${C.i+1<C.qs.length?"Câu tiếp theo":"Xem kết quả"}</button></div>`:""}</div>`;
  }
  else if(C.phase==="done"){
    const F = C.final;
    body = `<div class="qcard score">${mascot()}<h2>${F.score}/${F.total} câu đúng</h2>
      <p>${F.passed ? "Bạn đã chứng minh mình hiểu bài rồi! 🎉" : "Không sao cả, câu sai đã vào Sổ ôn tập 📒, mai mình ôn lại nhé."}</p>

  }
  app.innerHTML = head + body;
  document.getElementById("back").onclick=()=>{ if(ckRec){ try{ckRec.abort()}catch(e){} ckRec=null; } go("home"); refreshState(); };

  on("ckMic",()=>{
    if(ckRec){ try{ckRec.stop()}catch(e){} return; }

    render();
  });

    catch(e){ C.phase="explain"; alert(copyFor(e&&e.code)); }
    if(state.view==="check") render();
  });
  on("ckGoQ", async()=>{
    C.phase="loadingQ"; render();
    try{ const d = await api("/api/check_questions",{id:C.id}); Object.assign(C,{qs:d.questions, i:0, results:[], picked:null, phase:"q"}); }
    catch(e){ C.phase="explained"; alert(copyFor(e&&e.code)); }
    if(state.view==="check") render();
  });
  app.querySelectorAll(".qcard .opt").forEach(b=>b.onclick=async()=>{
    if(C.picked!==null && C.picked!==undefined) return;

    catch(e){ alert(copyFor(e&&e.code)); }
    render();
  });
  on("ckNext",()=>{ if(C.i+1<C.qs.length){ C.i++; C.picked=null; render(); } else { C.phase="done"; render(); } });
  on("ckHome",()=>{ go("home"); refreshState(); });
}

async function compressSchoolImage(file){
  if(!file.type.startsWith('image/'))return file;
  const bitmap=await createImageBitmap(file);
  try{
    const scale=Math.min(1,1800/Math.max(bitmap.width,bitmap.height));
    const width=Math.max(1,Math.round(bitmap.width*scale)),height=Math.max(1,Math.round(bitmap.height*scale));
    const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
    const ctx=canvas.getContext('2d',{alpha:false});
    if(!ctx)throw Error('Không thể xử lý ảnh trên thiết bị');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.drawImage(bitmap,0,0,width,height);
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Không nén được ảnh')),'image/jpeg',0.78));
    return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});
  }finally{bitmap.close();}
}
function schoolAnalysisView(raw){
  if(!raw)return '<p class="muted">Chưa phân tích AI.</p>';

  const list=(items,empty)=>items?.length?'<ol class="school-analysis-list">'+items.map(v=>'<li>'+esc(String(v))+'</li>').join('')+'</ol>':'<p class="muted">'+empty+'</p>';
  const questions=Array.isArray(a.questions)?a.questions:[];
  const skills=Array.isArray(a.skills)?a.skills:[];
  const unclear=Array.isArray(a.unclear)?a.unclear:[];
  return '<details class="school-analysis"><summary>📋 Xem kết quả AI phân tích ('+questions.length+' câu hỏi)</summary>'+
    '<div class="school-analysis-body"><h4>Tóm tắt</h4><p>'+esc(a.summary||'Không có tóm tắt')+'</p>'+
    '<h4>Kỹ năng nhận diện</h4>'+list(skills,'Chưa nhận diện được kỹ năng')+
    '<h4>Câu hỏi trích xuất</h4>'+list(questions,'AI chưa trích xuất được câu hỏi nào từ tài liệu này.')+
    '<h4>Phần chưa rõ</h4>'+list(unclear,'Không có ghi chú về phần chưa rõ')+
    (!questions.length?'<p class="school-analysis-warning" role="status">Chưa thể duyệt làm nguồn ra đề vì AI chưa trích xuất được câu hỏi. Hãy kiểm tra ảnh gốc hoặc tải ảnh rõ hơn.</p>':'')+

  app.querySelectorAll("[data-qa-approve]").forEach(btn=>btn.onclick=async()=>{
    const id=+btn.dataset.qaApprove;
    if(!confirm("Bạn đã tự kiểm tra đề, đáp án và lời giải câu #"+id+"? Câu này sẽ được sử dụng với nhãn duyệt bởi phụ huynh."))return;
    const note=prompt("Ghi nhận xét xác nhận (ít nhất 5 ký tự):","Đã kiểm tra đề và đáp án, đúng.");
    if(!note||note.trim().length<5)return;
    try{await api("/api/parent/question_qa_approve",{question_id:id,note:note.trim()},true);await loadPTab("questionqa");}catch(e){alert(copyFor(e&&e.code));}
  });
  app.querySelectorAll("[data-qa-edit]").forEach(btn=>btn.onclick=async()=>{
    const id=+btn.dataset.qaEdit;
    const x=(data.questions||[]).find(v=>+v.id===id);
    if(!x)return;
    let opts=[];try{opts=JSON.parse(x.options||"[]");}catch(e){}
    const question=prompt("Sửa nội dung câu hỏi:",x.q);
    if(question===null)return;
    const updated=[];
    for(let i=0;i<opts.length;i++){const v=prompt("Đáp án "+("ABCD"[i])+":",opts[i]);if(v===null)return;updated.push(v.trim());}
    const choice=prompt("Đáp án đúng (A, B, C hoặc D):","ABCD"[+x.answer]);
    if(choice===null)return;
    const answer="ABCD".indexOf(choice.trim().toUpperCase());
    const explain=prompt("Lời giải (bắt buộc):",x.explain||"");
    if(explain===null)return;
    const hint=prompt("Gợi ý:",x.hint||"");
    if(hint===null)return;
    if(question.trim().length<10||answer<0||answer>=updated.length||explain.trim().length<5||updated.some(v=>!v)){alert("Kiểm tra lại nội dung, đáp án và lời giải.");return;}
    if(!confirm("Lưu chỉnh sửa câu #"+id+"? Câu sẽ về Chờ Claude, không dùng cho Kem cho đến khi duyệt lại."))return;
    try{await api("/api/parent/question_qa_edit",{question_id:id,q:question.trim(),options:updated,answer,explain:explain.trim(),hint:hint.trim()},true);await loadPTab("questionqa");}catch(e){alert(copyFor(e&&e.code));}
  });
  app.querySelectorAll("[data-qa-report]").forEach(btn=>btn.onclick=async()=>{
    const reason=prompt("Vì sao câu này cần kiểm tra lại? (ít nhất 5 ký tự)");
    if(!reason||reason.trim().length<5)return;
    try{await api("/api/parent/question_qa_report",{question_id:+btn.dataset.qaReport,reason:reason.trim()},true);state.qaStatus="needs_review";await loadPTab("questionqa");}catch(e){alert(copyFor(e&&e.code));}
  });
  app.querySelectorAll("[data-qa-reject]").forEach(btn=>btn.onclick=async()=>{
    const id=+btn.dataset.qaReject;
    if(!confirm("Loại câu #"+id+" khỏi ngân hàng dùng cho Kem?"))return;
    const note=prompt("Ghi lý do loại câu (ít nhất 5 ký tự):");if(!note||note.trim().length<5)return;
    try{await api("/api/parent/question_qa_reject",{question_id:id,note:note.trim()},true);await loadPTab("questionqa");}catch(e){alert(copyFor(e&&e.code));}
  });
}
// ---------- Cổng ba mẹ: các thẻ ----------
const PTABS = [
  {id:"overview", name:"🏠 Tổng quan"}, {id:"results", name:"📊 Kết quả"}, {id:"work", name:"📝 Bài làm"},
  {id:"schedule", name:"🗓️ Lịch học"}, {id:"plan", name:"📋 Kế hoạch"}, {id:"stars", name:"⭐ Sao & quà"},
  {id:"videos", name:"📺 Video"}, {id:"exercises", name:"📚 Bài tập trường"}, {id:"questionqa", name:"🛡️ Kiểm duyệt câu hỏi"}, {id:"settings", name:"⚙️ Cài đặt"}];
const PTAB_SUB = {schedule:"schedule", plan:"plan", videos:"videos", exercises:"exercises", questionqa:"questionqa"};
state.pg = state.pg || {};
function ptab(){ const h=(location.hash||"").slice(1); return PTABS.some(t=>t.id===h) ? h : "overview"; }
// Danh sách dài: chia trang (mỗi danh sách nhớ trang riêng)
function pager(key, arr, per, item, empty){
  if(!arr || !arr.length) return empty || `<p class="muted" style="margin:0">Chưa có.</p>`;
  const pages = Math.ceil(arr.length/per), p = Math.min(pages-1, Math.max(0, state.pg[key]||0));
  return arr.slice(p*per, p*per+per).map(item).join("") + (pages>1 ? `<div class="pager"><button data-pg="${key}" data-d="-1" ${p===0?"disabled":""}>‹ Trước</button><span>Trang ${p+1}/${pages}</span><button data-pg="${key}" data-d="1" ${p>=pages-1?"disabled":""}>Sau ›</button></div>` : "");
}
// Thanh thẻ nằm trong thanh tiêu đề (dính trên đầu khi cuộn)
function renderPNav(R){
  let nav = document.getElementById("pnav");
  if(!nav){ nav=document.createElement("nav"); nav.id="pnav"; nav.className="pnav"; nav.setAttribute("aria-label","Các mục của Góc ba mẹ"); document.querySelector(".bar").appendChild(nav); }
  const cur = ptab();
  const help = (R?.today?.items||[]).filter(it=>it.status==="needs_help" && !it.done).length;
  const badge = {stars: R?.shop_pending||0, overview: help};
  nav.innerHTML = R ? PTABS.map(t=>`<button data-tab="${t.id}" ${t.id===cur?'aria-current="page"':""}>${t.name}${badge[t.id]?`<span class="dot">${badge[t.id]}</span>`:""}</button>`).join("") : "";
  nav.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>openPTab(b.dataset.tab));
  const curBtn = nav.querySelector('[aria-current="page"]'); if(curBtn) curBtn.scrollIntoView({block:"nearest", inline:"nearest"});
  let lo = document.getElementById("plogout");
  if(R && !lo){ lo=document.createElement("button"); lo.id="plogout"; lo.className="iconbtn"; lo.textContent="Đăng xuất"; lo.onclick=parentLogout; document.querySelector(".bar .spacer").after(lo); }
  if(!R && lo) lo.remove();
}
async function openPTab(t){
  if(location.hash.slice(1)!==t) history.pushState(null, "", "#"+t);
  state.transcript=null; state.hwDetail=null;
  await loadPTab(t);
}
async function loadPTab(t){
  state.parentPage = PTAB_SUB[t] || (t==="stars" ? (state.pstar||"shop") : null);
  if(t==="stars" && state.parentPage==="shop") return openParentShop();
  if(t==="schedule") state.sched=null;
  if(t==="plan") state.pplan={loading:"Đang mở…"};
  if(t==="videos") state.vids=null;
  if(t==="exercises") state.schoolFiles=null;
  if(t==="questionqa") state.questionQA=null;
  if(t==="stars") state.rw=null;
  render(); window.scrollTo(0,0);
  try{
    if(t==="schedule") state.sched=(await api("/api/parent/schedule",{},true)).schedule;
    else if(t==="plan") state.pplan=await api("/api/parent/plan",{},true);
    else if(t==="videos") state.vids=(await api("/api/parent/videos",{},true)).videos;
    else if(t==="exercises") state.schoolFiles=(await api("/api/parent/school_exercises",{},true)).files;
    else if(t==="questionqa") state.questionQA=await api("/api/parent/question_qa_list",{status:state.qaStatus||"needs_review",page:state.qaPage||1},true);
    else if(t==="stars") state.rw=await api("/api/parent/rewards",{},true);
    else return;
  }catch(e){ if(t==="plan") state.pplan={error:copyFor(e&&e.code)}; else if(t==="stars") state.rw={error:copyFor(e&&e.code)}; else alert(copyFor(e&&e.code)); }
  if(ptab()===t) render();
}
window.addEventListener("popstate", ()=>{ if(PARENT_MODE && state.report){ state.transcript=null; state.hwDetail=null; loadPTab(ptab()); } });

// Trang con (lịch học, kế hoạch, sao, đổi quà, video) hiện bên trong khung thẻ: bỏ nút "‹ Báo cáo" vì đã có thanh thẻ
function wrapPSub(){
  if(!PARENT_MODE || !state.report) return;
  renderPNav(state.report);
  const bk = app.querySelector("#back"); if(bk) bk.remove();
  if(ptab()==="stars" && !app.querySelector(".seg")){
    app.insertAdjacentHTML("afterbegin", `<div class="seg" role="group" aria-label="Sao và quà"><button data-ps="shop" aria-pressed="${state.parentPage==="shop"}">🎁 Đổi quà${state.report.shop_pending?` (${state.report.shop_pending})`:""}</button><button data-ps="rewards" aria-pressed="${state.parentPage==="rewards"}">⭐ Luật thưởng sao</button></div>`);
    app.querySelectorAll("[data-ps]").forEach(b=>b.onclick=()=>{ state.pstar=b.dataset.ps; loadPTab("stars"); });
  }
}

function renderPortalTab(R){
  renderPNav(R);
  const t = ptab();
  const html = {overview:pOverview, results:pResults, work:pWork, settings:pSettings}[t];
  if(!html){ loadPTab(t); return; }
  app.innerHTML = html(R);
  app.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{ const k=b.dataset.pg; state.pg[k]=(state.pg[k]||0)+(+b.dataset.d); render(); });
  app.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{ if(b.dataset.ps) state.pstar=b.dataset.ps; openPTab(b.dataset.goto); });
  app.querySelectorAll(".convlist button[data-hw]").forEach(b=>b.onclick=async()=>{
    try{ state.hwDetail = (await api("/api/parent/homework",{id:+b.dataset.hw},true)).homework; render(); window.scrollTo(0,0); }
    catch(e){ alert(copyFor(e&&e.code)); }
  });
  app.querySelectorAll(".convlist button[data-id]").forEach(b=>b.onclick=async()=>{
    try{ state.transcript = await api("/api/parent/conversation",{id:+b.dataset.id},true); render(); window.scrollTo(0,0); }
    catch(e){ alert(copyFor(e&&e.code)); }
  });
  if(t==="settings") wireSettings(R);
}
const ddmm2 = d => d.slice(8,10)+"/"+d.slice(5,7);
const P_TASK_ST = {planned:"Chưa làm", started:"Đang làm", paused:"Tạm dừng", completed:"✅ Xong", needs_help:"🙋 Cần giúp"};

function pOverview(R){
  const max = Math.max(1, ...R.days.map(d=>d.n));
  const total14 = R.days.reduce((a,d)=>a+d.n,0), active = R.days.filter(d=>d.n>0).length;
  const sum = (R.subjects||[]).reduce((a,x)=>({c:a.c+(+x.correct||0), t:a.t+(+x.total||0)}), {c:0,t:0});
  const accAll = sum.t ? Math.round(100*sum.c/sum.t)+"%" : "–";
  const items = R.today?.items||[], done = items.filter(it=>it.done).length, mins = items.reduce((a,it)=>a+(+it.minutes||0),0);
  const help = items.filter(it=>it.status==="needs_help" && !it.done);
  const alerts = [
    ...help.map(it=>`<div class="alert help"><span>🙋 Bé cần giúp: <b>${esc(it.title)}</b>${it.help_note?` – “${esc(it.help_note)}”`:""}</span></div>`),
    R.shop_pending ? `<button class="alert" data-goto="stars" data-ps="shop"><span>🎁 Có <b>${R.shop_pending}</b> yêu cầu đổi quà chờ ba mẹ duyệt</span><span>Xem ›</span></button>` : "",
    R.review.due>5 ? `<div class="alert"><span>📒 Sổ ôn tập có <b>${R.review.due}</b> câu đến hạn hôm nay</span></div>` : ""].join("");
  const acc = (R.subjects||[]).map(x=>{ const pct = x.total ? Math.round(100*(+x.correct||0)/x.total) : 0;
    return `<div class="acc"><span>${esc(subjById(x.subject)?.name||x.subject)}</span><div class="track"><div class="fill" style="width:${pct}%"></div></div><span>${pct}%</span></div>`; }).join("");
  const now = new Date();
  return `<div class="phead"><div><h2>Chào ba mẹ 👋</h2><div class="sub">${["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"][now.getDay()]}, ${String(now.getDate()).padStart(2,"0")}/${String(now.getMonth()+1).padStart(2,"0")} · tình hình học của ${esc(R.settings.nick||"bé")}</div></div></div>
    ${alerts?`<div class="alerts">${alerts}</div>`:""}
    <div class="kpis">
      <div class="kpi"><div class="l">Sao hiện có</div><div class="v">⭐ ${R.stars}</div></div>
      <div class="kpi"><div class="l">Việc hôm nay</div><div class="v">${done}/${items.length}</div><div class="s">khoảng ${mins} phút</div></div>
      <div class="kpi"><div class="l">Ngày có học (14 ngày)</div><div class="v">${active}/14</div><div class="s">${total14} hoạt động</div></div>
      <div class="kpi"><div class="l">Tỉ lệ đúng đố vui</div><div class="v">${accAll}</div><div class="s">${sum.t} câu đã làm</div></div>
      <div class="kpi"><div class="l">Sổ ôn tập</div><div class="v">${R.review.pending}</div><div class="s">${R.review.due} câu đến hạn · thuộc ${R.review.mastered}</div></div>
    </div>
    <div class="pgrid">
      <div class="card"><h3>📅 Hôm nay của bé</h3>
        ${items.length?`<div class="prog"><div style="width:${Math.round(100*done/Math.max(1,items.length))}%"></div></div>
        ${items.map(it=>{ const st = it.done ? "completed" : (it.status||"planned");
          return `<div class="tline"><span>${it.icon} ${esc(it.title)} <span class="muted" style="font-size:13px">· ${it.minutes}′</span></span><span class="st ${st==="completed"?"approved":st==="needs_help"?"rejected":st==="started"?"pending":""}">${P_TASK_ST[st]}</span></div>`; }).join("")}` : `<p class="muted" style="margin:0">Hôm nay chưa có danh sách.</p>`}
        <div class="row" style="margin-top:10px"><button class="btn" data-goto="schedule">Sửa lịch học</button><button class="btn" data-goto="plan">Kế hoạch tuần</button></div></div>
      <div class="card"><h3>📈 14 ngày qua</h3>
        <div class="bars">${R.days.map(d=>`<div style="height:${Math.round(100*d.n/max)}%" title="${ddmm2(d.day)}: ${d.n} hoạt động"></div>`).join("")}</div>
        <div class="barlabels"><span>${ddmm2(R.days[0].day)}</span><span>Hôm nay</span></div>
        <h3 style="margin-top:16px">🎯 Tỉ lệ đúng theo môn</h3>
        ${acc || `<p class="muted" style="margin:0">Chưa có lượt đố vui nào.</p>`}</div>
    </div>

        ${pager("sp", R.speaking, 5, t=>`<div class="fix"><small class="muted">${fmtDate(t.created_at)} · ${esc(SP_TYPES[t.type]?.name||"")}</small><br>
          <b>${esc(t.prompt)}</b><br>${LV[t.level]||""} Bé nói: “${esc(t.transcript||"(không nghe được)")}”</div>`, `<p class="muted" style="margin:0">Bé chưa luyện nói lần nào.</p>`)}</div>

          <label for="nick">Mây gọi bé là (tên ở nhà)</label>
          <input class="field" id="nick" value="${esc(S.nick)}" placeholder="Ví dụ: Bông">
          <label for="focus">Ghi chú của ba mẹ cho Mây (Mây ưu tiên nội dung này)</label>
          <textarea class="field" id="focus" rows="4" maxlength="400" placeholder="Ví dụ: TV còn nhầm danh từ/động từ; Maths: luyện làm tròn số">${esc(S.focus)}</textarea>
        </div>
        <div class="fsec"><h4>📖 Đọc tiếng Anh</h4>
          <label><input type="checkbox" id="readDaily" ${S.read_daily?"checked":""}>Mỗi ngày có việc “Đọc tiếng Anh 10 phút”</label>
          <label for="readLevel">Mức bài đọc (Mây tự lên/xuống theo kết quả)</label>
          <select class="field" id="readLevel">${[1,2,3,4,5].map(n=>`<option value="${n}" ${S.read_level===n?"selected":""}>Mức ${n}${[""," – rất dễ (60–90 từ)"," – dễ (90–120 từ)"," – vừa (120–150 từ)"," – lớp 4 (150–190 từ)"," – khó hơn (190–230 từ)"][n]}</option>`).join("")}</select>
          <label><input type="checkbox" id="famousOn" ${S.famous_on?"checked":""}>Thứ 3, 5, 7 đọc tiểu sử người nổi tiếng</label>
          <label for="famousList">Danh sách người nổi tiếng (mỗi dòng một người)</label>
          <textarea class="field" id="famousList" rows="5">${esc(S.famous_people||"")}</textarea>
        </div>
        <div class="fsec"><h4>🧩 Tiếng Việt & 🔬 Science</h4>
          <label><input type="checkbox" id="tvwOn" ${S.tvw_on?"checked":""}>Thứ 3, 5, 7 có việc “Luyện từ và câu 8 phút” (danh từ/động từ, từ nối)</label>
          <label><input type="checkbox" id="sciOn" ${S.sci_on?"checked":""}>Chủ nhật có “Thí nghiệm nhỏ (Science)” nếu tuần đó bé chưa làm</label>
        </div>
        <div class="fsec"><h4>🧮 Word problems (Maths)</h4>
          <label><input type="checkbox" id="wpOn" ${S.wp_on?"checked":""}>Thứ 2 và thứ 6 có việc “Word problems 15 phút”</label>
          <label for="wpLevel">Mức bài toán (Mây tự lên/xuống theo kết quả)</label>
          <select class="field" id="wpLevel">${[1,2,3,4,5].map(n=>`<option value="${n}" ${S.wp_level===n?"selected":""}>Mức ${n}${[""," – 1 bước, số đến 1.000"," – 1 bước, số đến 10.000"," – 2 bước, đúng mức lớp 4"," – 2 bước, có làm tròn/ước lượng"," – nhiều bước, nâng cao"][n]}</option>`).join("")}</select>
        </div>
        <div class="fsec"><h4>🎧 Nghe tiếng Anh</h4>
          <label><input type="checkbox" id="listenOn" ${S.listen_on?"checked":""}>Thứ 2, 4, 6 có việc “Nghe tiếng Anh 10 phút”</label>
          <label for="listenLevel">Mức bài nghe</label>
          <select class="field" id="listenLevel">${[1,2,3,4,5].map(n=>`<option value="${n}" ${S.listen_level===n?"selected":""}>Mức ${n}${[""," – Starters, rất dễ"," – Movers dễ"," – Movers"," – Flyers dễ"," – Flyers"][n]}</option>`).join("")}</select>
        </div>
        <div class="row" style="margin-top:12px"><button class="btn primary" id="saveSettings">Lưu cài đặt</button><span class="muted" id="setMsg" style="align-self:center"></span></div>
      </div>
      <div>
        <div class="card" id="driveCard"><h3>Lưu ảnh bài tập lên Google Drive</h3><p class="muted" style="margin:0">Đang tải…</p></div>
        <div class="card"><h3>🔐 Tài khoản</h3>
          <p class="muted" style="margin:0 0 8px">Máy này giữ đăng nhập 7 ngày. Dùng máy chung với bé thì nhớ đăng xuất.</p>
          <button class="btn" id="lock">Đăng xuất</button></div>
        <div class="card danger-zone"><h3>⚠️ Xoá dữ liệu</h3>
          <p class="muted" style="margin:0 0 8px">Không khôi phục được. Mây sẽ hỏi lại và cần gõ <b>XOA</b> để xác nhận.</p>
          <div class="row"><button class="btn danger" id="clearChats">Xoá lịch sử trò chuyện</button><button class="btn danger" id="clearAll">Xoá toàn bộ dữ liệu học</button></div></div>
      </div>
    </div>`;
}
function wireSettings(R){
  document.getElementById("saveSettings").onclick=async()=>{
    const msg=document.getElementById("setMsg"); msg.textContent="Đang lưu…";
    const v=id=>document.getElementById(id);
    const S={chat_first:v("chatFirst").checked, nick:v("nick").value.trim(), focus:v("focus").value.trim(), read_daily:v("readDaily").checked, read_level:+v("readLevel").value,
             listen_on:v("listenOn").checked, listen_level:+v("listenLevel").value, wp_on:v("wpOn").checked, wp_level:+v("wpLevel").value, tvw_on:v("tvwOn").checked, sci_on:v("sciOn").checked, famous_on:v("famousOn").checked, famous_people:v("famousList").value};
    try{ await api("/api/parent/settings",S,true); me.chatFirst=S.chat_first; LS.set("chatFirst",me.chatFirst); me.nick=S.nick; LS.set("nick",S.nick); R.settings={...R.settings,...S}; msg.textContent="✅ Đã lưu"; }
    catch(e){ msg.textContent=copyFor(e&&e.code); }
  };
  loadDriveCard();
  document.getElementById("lock").onclick=parentLogout;
  // Xoá dữ liệu: phải gõ XOA để tránh bấm nhầm
  const clear = async(what, question)=>{
    const typed = prompt(question + "\n\nGõ XOA để xác nhận:");
    if(typed===null) return;
    if(typed.trim().toUpperCase()!=="XOA"){ alert("Chưa xoá: cần gõ đúng chữ XOA."); return; }
    try{ await api("/api/parent/clear",{what},true); Companion.clear(); state.report = await api("/api/parent/report",{},true); render(); }
    catch(e){ alert(copyFor(e&&e.code)); }
  };
  document.getElementById("clearChats").onclick=()=>clear("chats","Xoá toàn bộ lịch sử trò chuyện của bé?");
  document.getElementById("clearAll").onclick=()=>clear("all","Xoá TOÀN BỘ dữ liệu học (trò chuyện, sổ ôn tập, điểm, sao)? Không khôi phục được.");
}
function renderTranscript(){
  const T = state.transcript, c = T.conversation;
  app.innerHTML = `
    <button class="back" id="back">‹ Báo cáo</button>
    <h2 style="font-size:28px">${esc(c.subject==="companion"?"Mây & Kem":subjById(c.subject)?.name||"")}${c.topic?": "+esc(c.topic):""}</h2>
    <p class="muted" style="margin:4px 0 0">${fmtDate(c.started_at)}</p>
    ${T.learning_memory ? `<div class="card"><h3>Lời bé kể về việc học</h3><p class="muted">Lời bé tự kể, chưa được chấm hoặc xác nhận thành thạo. Có thể xoá cùng lịch sử trò chuyện trong Cài đặt.</p>${(T.learning_memory.recaps||[]).map(r=>`<p><b>${esc(r.day)} · ${esc(r.label||r.subject||"Tự kể")}</b>: ${esc(r.text)}</p>`).join("")}</div>` : ""}
    <div class="transcript">${T.messages.map(m=>`<div class="t ${m.role==="assistant"?"assistant":"user"}">${fmt(m.content)}</div>`).join("")}</div>`;
  document.getElementById("back").onclick=()=>{ state.transcript=null; render(); window.scrollTo(0,0); };
}

function renderParentHomework(){
  const h = state.hwDetail, R = h.result || {items:[]};
  app.innerHTML = `
    <button class="back" id="back">‹ Báo cáo</button>
    <h2 style="font-size:28px">${esc(subjById(h.subject)?.name||"")}${R.title?": "+esc(R.title):""}</h2>
    <p class="muted" style="margin:4px 0 0">${fmtDate(h.created_at)}, ${h.photos} ảnh${h.recheck_of?", bài bé đã sửa lại":""}${h.note?`. Ghi chú: ${esc(h.note)}`:""}</p>
    ${(h.drive||[]).length ? `<div class="card"><h3>Ảnh bài làm trên Google Drive</h3><div class="row">${h.drive.map((f,i)=>`<a class="btn" target="_blank" rel="noopener" href="https://drive.google.com/file/d/${encodeURIComponent(f.file_id)}/view">📄 Trang ${i+1}</a>`).join("")}</div>
      <p class="muted" style="margin:6px 0 0">Mở bằng tài khoản Google của gia đình.</p></div>` : ""}
    ${R.summary_for_parent ? `<div class="card"><h3>Tóm tắt cho ba mẹ</h3><p style="margin:0">${fmt(R.summary_for_parent)}</p></div>` : ""}
    ${(R.items||[]).map(x=>`<div class="hwitem ${esc(x.status)}">
      <div class="top"><b>${esc(x.label)}</b><span class="st ${esc(x.status)}">${HW_ST[x.status]||""}</span></div>
      ${x.task?`<div class="small">Đề: ${fmt(x.task)}</div>`:""}${x.student?`<div class="small">Bé làm: ${fmt(x.student)}</div>`:""}
      ${x.comment?`<div style="margin-top:4px">${fmt(x.comment)}</div>`:""}
      ${x.fix?`<div class="reveal">✅ ${fmt(x.fix)}</div>`:""}
    </div>`).join("")}
    ${R.tips?.length ? `<div class="card"><h3>Lời khuyên Mây đưa cho bé</h3><ul class="tips">${R.tips.map(t=>`<li>${fmt(t)}</li>`).join("")}</ul></div>` : ""}`;
  document.getElementById("back").onclick=()=>{ state.hwDetail=null; render(); window.scrollTo(0,0); };
}

/* ---------- break reminder ---------- */
let lastBreak = Date.now();
setInterval(()=>{
  if(Date.now()-lastBreak < 25*60*1000 || document.getElementById("overlayHost").innerHTML) return;
  document.getElementById("overlayHost").innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><div class="box">${mascot()}
    <h2 style="font-size:28px;margin:8px 0">Nghỉ mắt chút nhé!</h2>
    <p>Mình học được 25 phút rồi. Hãy nhìn ra xa, uống ngụm nước và vươn vai 5 phút nha ${esc(nick())} 🌿</p>
    <button class="btn primary" id="rested">Mình nghỉ xong rồi</button></div></div>`;
  document.getElementById("rested").onclick=()=>{ lastBreak=Date.now(); document.getElementById("overlayHost").innerHTML=""; };
}, 60*1000);


if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{})); }
if(PARENT_MODE){
  // Cổng ba mẹ: không có phần của bé; kiểm tra phiên đăng nhập còn hạn thì vào thẳng báo cáo
  document.querySelector(".bar .title").textContent = "Góc ba mẹ";
  document.body.classList.add("pmode");
  document.getElementById("starPill").style.display = "none";
  document.getElementById("parentBtn").style.display = "none";
  document.getElementById("homeBtn").onclick=()=>{ if(state.report) openPTab("overview"); };
  state.view = "parent"; state.pAuth = "checking"; render();
  loadReport().catch(()=>{ state.pAuth = null; render(); });
} else {
  document.getElementById("homeBtn").onclick=()=>{ go("home"); refreshState(); };
  document.getElementById("parentBtn").onclick=()=>go("parent");
  document.getElementById("starPill").onclick=()=>{ if(ready()) openShop(); };
  document.getElementById("starPill").style.cursor="pointer";
  render();
  refreshState();
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && state.view==="home") refreshState(); });
</script>
</body>
</html>
