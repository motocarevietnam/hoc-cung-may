<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học cùng Mây</title>
<link rel="stylesheet" href="/conversation.css?v=20261112multiline1">
<link rel="manifest" href="/manifest.webmanifest" id="manifestLink">
<script>
  // Cổng ba mẹ /parents/: dùng chung giao diện, nhưng là "app" riêng khi thêm vào màn hình chính
  if(location.pathname.startsWith("/parents")){
    document.getElementById("manifestLink").href = "/parents-manifest.webmanifest";
    document.title = "Mây – Góc ba mẹ";
  }
</script>
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Học cùng Mây">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --grid:#EEE8FC; --grid-strong:#D9CCF6; --margin:#F3A1A1;
  --ink:#3B2470; --ink-soft:#6E5C99; --surface:#FFFFFF; --surface-2:#F6F1FF;
  --sun:#FFC83D; --mint:#1FA97F; --mint-bg:#DDF6EC; --coral:#E35B5B; --coral-bg:#FDE4E4;
  --l1:#FFE08A; --l2:#B9E8D5; --l3:#FFC9C2; --l4:#C9DFFF; --l5:#E7D4FF; --label-ink:#2B1B52;
  --me:#3B2470; --me-ink:#FFFFFF; --line:#D9CCF6;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C2A2B; --grid:#233334; --grid-strong:#2C3F40; --margin:#7A4545;
    --ink:#F2F5EC; --ink-soft:#B8C7BF; --surface:#243536; --surface-2:#2B3E3F;
    --mint:#5FD8AE; --mint-bg:#1F4237; --coral:#FF8C8C; --coral-bg:#4A2A2A;
    --me:#E7D4FF; --me-ink:#2B1B52; --line:#3A5051;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C2A2B; --grid:#233334; --grid-strong:#2C3F40; --margin:#7A4545;
  --ink:#F2F5EC; --ink-soft:#B8C7BF; --surface:#243536; --surface-2:#2B3E3F;
  --mint:#5FD8AE; --mint-bg:#1F4237; --coral:#FF8C8C; --coral-bg:#4A2A2A;
  --me:#E7D4FF; --me-ink:#2B1B52; --line:#3A5051;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-strong) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px);
  background-size:28px 28px,28px 28px,7px 7px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky,#4BA3F5);outline-offset:2px;border-radius:10px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:8px 14px}
.bar .home{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.bar .home svg{width:42px;height:34px}
.bar .title{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.bar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-family:var(--display);font-weight:700;font-size:18px}
.pill.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.25)}}
.iconbtn{background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:5px 10px;font-size:15px}

main{max-width:760px;margin:0 auto;padding:18px 16px 40px 34px;position:relative;min-height:calc(100vh - 60px)}
main::before{content:"";position:absolute;top:0;bottom:0;left:18px;width:2px;background:var(--margin);opacity:.8}

h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
.greet{display:flex;gap:14px;align-items:flex-end;margin:6px 0 22px}
.greet svg{width:96px;height:78px;flex:none}
.say{background:var(--surface);border:2.5px solid var(--ink);border-radius:20px 20px 20px 4px;padding:12px 16px;font-size:18px;max-width:440px}
.say b{font-family:var(--display);font-size:22px}

.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.label{position:relative;border:0;text-align:left;padding:16px 18px 14px;border-radius:18px;color:var(--label-ink);
  box-shadow:0 3px 0 rgba(43,27,82,.25);transition:transform .15s}
.label::after{content:"";position:absolute;inset:6px;border:2px dashed rgba(43,27,82,.35);border-radius:13px;pointer-events:none}
.label:nth-child(odd){transform:rotate(-1.2deg)}
.label:nth-child(even){transform:rotate(1deg)}
.label:hover{transform:rotate(0) translateY(-2px)}
.label .ic{font-size:30px;line-height:1}
.label h3{font-size:26px;margin-top:6px}
.label small{font-size:14px;opacity:.8}

.back{background:none;border:0;padding:4px 0;color:var(--ink-soft);font-size:15px;margin-bottom:8px}
.sec-title{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sec-title .badge{font-size:34px;width:58px;height:58px;display:grid;place-items:center;border-radius:16px;color:var(--label-ink)}
.sec-title h2{font-size:32px}
.muted{color:var(--ink-soft);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.mode{background:var(--surface);border:2.5px solid var(--ink);border-radius:20px;padding:18px;text-align:left;box-shadow:4px 4px 0 var(--ink)}
.mode:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.mode .big{font-size:36px}
.mode h3{font-size:24px;margin:4px 0 2px}
@media (max-width:480px){.modes{grid-template-columns:1fr}}

.notice{background:var(--surface-2);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:15px}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;margin:10px 0 16px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg svg{width:40px;height:32px;flex:none}
.bubble{padding:10px 14px;border-radius:18px;white-space:normal;overflow-wrap:anywhere}
.msg.buddy .bubble{background:var(--surface);border:2px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end}
.msg.me .bubble{background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
.msg.err .bubble{background:var(--coral-bg);border-color:var(--coral)}
.speak{background:none;border:0;font-size:16px;padding:2px 4px;opacity:.7}
.thinking{display:inline-flex;gap:4px}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--ink-soft);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.composer{position:sticky;bottom:0;background:var(--surface);border:2.5px solid var(--ink);border-radius:20px;padding:8px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;padding:8px;min-height:44px;max-height:168px;outline:none}
.chat-input-tools{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:6px 0 0}
.chat-input-tools span{font-size:13px;line-height:1.4;color:var(--ink-soft);flex:1;min-width:120px}
.chat-input-tools .chat-linebreak{min-height:44px;padding:6px 10px;font-size:14px;border-radius:10px;flex:0 0 auto}
.send{background:var(--ink);color:var(--paper);border:0;border-radius:14px;padding:10px 18px;font-family:var(--display);font-weight:700;font-size:18px}
.send:disabled{opacity:.5;cursor:default}
.mic{background:var(--sun);color:var(--label-ink);border:0;border-radius:14px;padding:9px 13px;font-size:22px;line-height:1}
.mic.on{background:var(--coral);color:#fff;animation:blink 1s infinite}
.langbtn{background:var(--surface-2);border:2px solid var(--line);border-radius:10px;padding:8px 8px;font-size:13px;font-weight:600;align-self:center}
.voicebar{display:flex;align-items:center;gap:10px;margin:6px 0 8px;flex-wrap:wrap}
.voicebar label{font-size:15px;display:flex;gap:8px;align-items:center;cursor:pointer}
.voicebar input{width:20px;height:20px;accent-color:var(--ink)}
.micnote{font-size:14px;color:var(--ink-soft);margin:6px 4px 0;min-height:1.2em}

/* Visual Quiz 10 */
.visual-quiz .q{font-size:clamp(22px,4vw,30px);font-weight:700}
.visual-quiz .opt{min-height:60px;font-size:20px;text-align:left}
.visual-quiz .letter{display:inline-flex;align-items:center;justify-content:center;border:2px solid currentColor;border-radius:50%;width:36px;height:36px;margin-right:12px}
.visual-quiz .quiz-banner{border-radius:18px;background:var(--surface-2);padding:18px;text-align:center;font-size:24px;margin:12px 0}
.visual-quiz .quiz-progressbar{height:10px;background:var(--grid-strong);border-radius:20px;overflow:hidden;margin:8px 0 14px}
.visual-quiz .quiz-progressbar span{display:block;height:100%;background:var(--mint)}

.ipa-mouth-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.ipa-mouth-card{border:2px solid var(--line);border-radius:18px;background:var(--surface-2);padding:10px;text-align:center;min-width:0}
.ipa-mouth-card svg{display:block;width:100%;max-width:180px;height:auto;margin:0 auto}
.ipa-mouth-card strong{display:block;font-size:24px;line-height:1.3}
.ipa-mouth-card small{display:block;color:var(--ink-soft);font-size:12px;line-height:1.4}
@media(max-width:370px){.ipa-mouth-grid{gap:6px}.ipa-mouth-card{padding:6px}.ipa-mouth-card strong{font-size:21px}}

/* Writing Studio mind map */
.writing-svg-scroll{overflow:hidden;width:100%}.writing-svg{display:block;width:100%;min-width:0;height:auto;max-height:none}.writing-map{overflow:hidden}
.writing-map{margin:14px 0;padding:16px;border:2px solid var(--line);border-radius:22px;background:var(--surface-2)}
.writing-map h3{text-align:center;margin:0 0 8px}
.writing-map-center{margin:10px auto;max-width:260px;text-align:center;border-radius:20px;background:var(--mint);color:#fff;padding:12px;font-weight:800;overflow-wrap:anywhere}
.writing-map-branches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.writing-map-node{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:12px;min-width:0;overflow-wrap:anywhere}
.writing-map-node b{display:block;margin-bottom:5px}
.writing-map-node p{margin:0;font-size:14px}
.writing-map-node.open{border-color:#6a9fc5}.writing-map-node.body{border-color:#6cae8b}.writing-map-node.end{border-color:#b18acf}.writing-map-node.words{border-color:#d5a653}
.writing-map .writing-note{font-size:14px;margin:12px 0 0}
@media(max-width:360px){.writing-map-branches{grid-template-columns:1fr}}
/* quiz */
.dots{display:flex;gap:8px;margin:8px 0 16px}
.dots span{width:30px;height:10px;border-radius:6px;background:var(--line)}
.dots span.ok{background:var(--mint)}.dots span.no{background:var(--coral)}.dots span.now{background:var(--sun)}
.qcard{background:var(--surface);border:2.5px solid var(--ink);border-radius:22px;padding:20px;box-shadow:5px 5px 0 var(--ink)}
.qcard .q{font-size:21px;font-weight:500;margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px}
.opt.right{background:var(--mint-bg);border-color:var(--mint)}
.opt.wrong{background:var(--coral-bg);border-color:var(--coral)}
.opt:disabled{cursor:default}
.btn:disabled{opacity:.5;cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:9px 16px;font-family:var(--display);font-weight:700;font-size:17px}
.btn.primary{background:var(--ink);color:var(--paper)}
.score{text-align:center;padding:10px 0}
.score .stars{font-size:clamp(20px,6.5vw,40px);letter-spacing:2px;line-height:1.3;overflow-wrap:anywhere;word-break:break-all;max-width:100%}
.qcard{max-width:100%;overflow:hidden}
.score h2{font-size:34px;margin:8px 0}

/* parent */
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.card h3{font-size:22px;margin-bottom:8px}
.card label{display:block;font-size:15px;font-weight:500;margin:10px 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.tablewrap{overflow-x:auto}

.overlay{position:fixed;inset:0;background:rgba(20,10,40,.55);display:grid;place-items:center;z-index:20;padding:20px}
.overlay .box{background:var(--surface);border:3px solid var(--ink);border-radius:24px;padding:24px;max-width:380px;text-align:center}
.overlay svg{width:110px;height:88px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.reviewbar{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--sun);color:var(--label-ink);border:2.5px solid var(--ink);border-radius:18px;padding:12px 16px;margin:0 0 22px;box-shadow:4px 4px 0 var(--ink)}
.reviewbar:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.reviewbar .ic{font-size:32px;line-height:1}
.reviewbar b{font-family:var(--display);font-size:22px;display:block;line-height:1.15}
.opt.chosen{outline:3px solid var(--sun);outline-offset:1px}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin:10px 0 4px}
.bars div{flex:1;background:var(--ink);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
.barlabels{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft)}
.acc{display:grid;grid-template-columns:96px 1fr 48px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.acc .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.acc .fill{height:100%;background:var(--mint)}
.weak{margin:8px 0 0;padding-left:20px;font-size:15px}
.convlist button{display:block;width:100%;text-align:left;background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:15px}
.convlist small{display:block;color:var(--ink-soft);font-size:13px}
.transcript{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.transcript .t{padding:8px 12px;border-radius:14px;font-size:15px;max-width:88%}
.transcript .t.user{background:var(--me);color:var(--me-ink);align-self:flex-end}
.transcript .t.assistant{background:var(--surface);border:2px solid var(--line)}
.btn.danger{border-color:var(--coral);color:var(--coral)}

/* chấm bài tập về nhà */
.hwbar{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--l2);color:var(--label-ink);border:2.5px solid var(--ink);border-radius:18px;padding:12px 16px;margin:0 0 22px;box-shadow:4px 4px 0 var(--ink)}
.hwbar:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.hwbar .ic{font-size:32px;line-height:1}
.hwbar b{font-family:var(--display);font-size:22px;display:block;line-height:1.15}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:12px 0}
.ph{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:var(--surface-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(20,10,40,.7);color:#fff;font-size:18px;line-height:1}
.ph .no{position:absolute;left:6px;bottom:6px;background:rgba(20,10,40,.7);color:#fff;border-radius:8px;padding:0 8px;font-size:13px}
.addph{aspect-ratio:3/4;border:2.5px dashed var(--ink-soft);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;color:var(--ink-soft)}
.addph span{font-size:36px}
.hwitem{background:var(--surface);border:2px solid var(--line);border-left-width:8px;border-radius:16px;padding:12px 14px;margin:10px 0}
.hwitem.right{border-left-color:var(--mint)}.hwitem.wrong{border-left-color:var(--coral)}
.hwitem.partial{border-left-color:var(--sun)}.hwitem.unclear,.hwitem.feedback{border-left-color:var(--l4)}
.hwitem .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hwitem .top b{font-family:var(--display);font-size:19px}
.st{font-size:13px;font-weight:600;border-radius:999px;padding:1px 10px;background:var(--surface-2)}
.st.right{background:var(--mint-bg);color:var(--mint)}.st.wrong{background:var(--coral-bg);color:var(--coral)}
.st.partial{background:#FFF1C7;color:#8A5A00}
.hwitem .small{font-size:14px;color:var(--ink-soft);margin:2px 0}
.hwitem .row{margin-top:8px}
.hwitem .btn{font-size:15px;padding:6px 12px}
.reveal{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:15px}
.tips{margin:6px 0 0;padding-left:20px}

/* kế hoạch học */
.today{background:var(--surface);border:2.5px solid var(--ink);border-radius:20px;padding:14px 16px;margin:0 0 18px;box-shadow:4px 4px 0 var(--ink)}
.today .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.today .head h3{font-size:24px}
.fdots{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.fdot{width:22px;height:8px;border-radius:999px;background:var(--line)}
.fdot.ok{background:var(--mint)}
.fdot.cur{background:var(--ink)}
.focus{position:relative;text-align:center;background:var(--surface-2);border:2px solid var(--line);border-radius:16px;padding:16px 34px 12px;touch-action:pan-y}
.focus .farr{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;font-size:34px;line-height:1;color:var(--ink-soft);padding:8px 6px}
.focus .farr.l{left:2px}.focus .farr.r{right:2px}
.focus.in-r{animation:fin-r .25s ease}.focus.in-l{animation:fin-l .25s ease}
@keyframes fin-r{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fin-l{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.focus .fnum{font-size:14px;color:var(--ink-soft);font-weight:600}
.focus .fic{font-size:52px;line-height:1.2;margin:4px 0}
.focus .ftt{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.25;margin-bottom:2px}
.focus .fgo{display:inline-block;width:auto;margin:12px auto 4px;font-size:20px;padding:12px 28px;justify-content:center}
.focus .frow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.frame{background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:8px 12px;margin:0 0 8px;font-size:16px}
.wpchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.tvw{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;margin:6px 0;border:2px solid var(--line);border-radius:12px;background:var(--surface)}

const fmtDate = t => new Date(t*1000).toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

async function api(path, body={}, asParent=false){
  body=Companion.request(path,body);
  const headers = {"content-type":"application/json"};
  // Ba mẹ: cổng /parents/ dùng phiên đăng nhập (cookie); máy của bé dùng mã PIN ba mẹ trong header (mục Cài đặt máy)
  if(asParent){ headers["x-requested-with"] = "may"; if(parentPin) headers["x-parent-pin"] = parentPin; }
  else headers["x-app-pin"] = pin;
  let res;
  try{ res = await fetch(path,{method:"POST",headers,body:JSON.stringify(body)}); }
  catch(e){ throw {code:"offline"}; }
  let data = {}; try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw {code: data.error || ("http_"+res.status), data};
  if(Array.isArray(data.awards) && data.awards.length){ setStars(data.stars); showAwards(data.awards); }
  await Companion.afterApi(path, body, data);
  return data;
}
// Báo cho bé biết vì sao được sao (ví dụ "⭐ +5 Hoàn thành nhiệm vụ")
function showAwards(list){
  let box = document.getElementById("awardToast");
  if(!box){ box = document.createElement("div"); box.id="awardToast"; document.body.appendChild(box); }
  box.innerHTML = list.map(a=>`<div>⭐ +${a.stars} ${esc(a.label)}</div>`).join("");
  box.classList.remove("show"); void box.offsetWidth; box.classList.add("show");
  clearTimeout(showAwards.t); showAwards.t = setTimeout(()=>box.classList.remove("show"), 3500);
}
function setStars(n){
  if(typeof n!=="number") return;
  const up = n > me.stars; me.stars = n; LS.set("starsCache", n);
  document.getElementById("starCount").textContent = n;
  if(up){ const p=document.getElementById("starPill"); p.classList.remove("pop"); void p.offsetWidth; p.classList.add("pop"); }
}
async function refreshState(){
  if(!ready()) return;
  try{
    const s = await api("/api/state");
    me.chatFirst = s.chat_first !== false; LS.set("chatFirst",me.chatFirst); me.nick = s.nick || ""; me.due = s.due || 0; LS.set("nick", me.nick); setStars(s.stars);
    me.pron = !!s.pron; me.weekWords = s.week_words || []; me.tts = !!s.tts; me.ttsVoices = s.tts_voices || null; me.ttsBy = s.tts_by || ""; me.nowTopics = s.now_topics || null; LS.set("ttsOn", me.tts); me.drive = !!s.drive;
    me.today = (await api("/api/plan",{view:"day"})).day;
  }catch(e){}
  if(state.view==="home") renderHome();
}

function go(view){
  view=Companion.beforeGo(view);
  if(state.ctl){ state.ctl.abort(); state.ctl=null; }
  if(rec){ try{rec.abort()}catch(e){} rec=null; }
  stopSpeakCapture(true);
  if(wrRec){ try{wrRec.abort()}catch(e){} wrRec=null; }
  if(wrTimer){ clearInterval(wrTimer); wrTimer=null; }
  stopReadRec();
  if(rtRec){ try{rtRec.abort()}catch(e){} rtRec=null; }
  if(typeof wpRec!=="undefined" && wpRec){ try{wpRec.abort()}catch(e){} wpRec=null; }
  if(typeof tvRec!=="undefined" && tvRec){ try{tvRec.abort()}catch(e){} tvRec=null; }
  if(typeof sciRec!=="undefined" && sciRec){ try{sciRec.abort()}catch(e){} sciRec=null; }
  stopVoice();
  if(view!=="parent"){ parentPin=""; state.devOk=false; state.report=null; state.transcript=null; state.hwDetail=null; state.parentPage=null; state.sched=null; state.pplan=null; state.rw=null; state.ps=null; } // rời Góc ba mẹ là khoá báo cáo
  state.view=view; render(); window.scrollTo(0,0);
}

// 📺 Video bài giảng ba mẹ đã duyệt, khớp bài đang học: gợi ý xem trước rồi mới trò chuyện (không bắt buộc)
async function loadChatVideos(s){
  const key = s.id + "|" + (state.topic||""), pending = state.pendingMsg; state.pendingMsg = null; state.vidShown = key;
  let vids = [];
  if(state.topic){ try{ vids = (await api("/api/video_for",{subject:s.id, topic:state.topic})).videos || []; }catch(e){} }
  if(state.view!=="chat" || state.subject!==s.id) return;
  if(!vids.length){ if(pending) sendChat(pending); return; }
  const en = s.lang==="en", wrap = document.getElementById("vidWrap"); if(!wrap) return;
  const min = v => Math.max(1, Math.round(v.play_seconds/60));
  const done = (msg)=>{ wrap.innerHTML=""; sendChat(msg); };
  wrap.innerHTML = `<div class="vidcard"><b>📺 ${en?"Watch a short video first?":"Xem video bài này trước nhé?"}</b>
    ${vids.map((v,i)=>`<button class="vidpick" data-v="${i}"><img src="https://i.ytimg.com/vi/${esc(v.yt)}/mqdefault.jpg" alt=""><span>${esc(v.lesson)}<small>${esc(v.channel)} · ${min(v)} phút</small></span></button>`).join("")}

function guessLang(text, fallback){
  const vi = (text.match(/[ăâđêôơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/gi)||[]).length;
  const words = text.split(/\s+/).length || 1;
  return vi/words > 0.15 ? "vi" : (fallback==="vi" && vi>0 ? "vi" : (vi/words > 0.08 && fallback==="vi" ? "vi" : fallback==="vi" ? "vi" : "en"));
}
// Giọng của Mây: dùng giọng đọc có sẵn trên máy. Mặc định nâng cao độ (pitch) để nghe như bạn nhỏ 8–10 tuổi.
// Ba mẹ chỉnh giọng, cao độ, tốc độ trong Góc ba mẹ; lưu riêng trên từng máy (mỗi máy có bộ giọng khác nhau).
const VOICE_PREF = {vi:["Linh","Google Tiếng Việt","HoaiMy","An"], en:["Samantha","Karen","Kate","Serena","Stephanie","Martha","Moira","Tessa","Google UK English Female","Google US English","Aria","Jenny","Ana"]};
const voiceCfg = () => ({vi:LS.get("voiceVi",""), en:LS.get("voiceEn",""), pitch:LS.get("pitch",1.4), speed:LS.get("speed",1)});
function voicesFor(l){ try{ return speechSynthesis.getVoices().filter(v=>v.lang && v.lang.toLowerCase().replace("_","-").startsWith(l)); }catch(e){ return []; } }
function pickVoice(l){
  const list = voicesFor(l), want = voiceCfg()[l];
  return list.find(v=>v.name===want)
    || VOICE_PREF[l].map(n=>list.find(v=>v.name.includes(n))).find(Boolean)
    || list.find(v=>/female|nữ/i.test(v.name)) || list[0] || null;
}
// Tách đoạn thành các phần theo ngôn ngữ, để phần tiếng Anh đọc bằng giọng Anh, phần tiếng Việt bằng giọng Việt.
// Ranh giới: câu, phần trong ngoặc (), ngoặc kép, chữ in đậm **…**, xuống dòng.
const VI_CHARS = /[ăâđêôơưàáạảãầấậẩẫằắặẳẵèéẹẻẽềếệểễìíịỉĩòóọỏõồốộổỗờớợởỡùúụủũừứựửữỳýỵỷỹ]/i;
function langChunks(text, fallback){
  const clean = String(text).replace(/[\u{1F300}-\u{1FAFF}☀-➿\u{1F1E6}-\u{1F1FF}️]/gu,"");
  // Môn tiếng Anh: không cắt ở chữ in đậm (thường nằm giữa câu tiếng Anh).
  // Môn tiếng Việt: cắt ở chữ in đậm để từ tiếng Anh in đậm được đọc bằng giọng Anh.
  const re = fallback==="en"
    ? /(\([^)]*\)|“[^”]*”|"[^"\n]*"|\n+|[^.!?…:\n(“"]+(?:[.!?…]+|:(?=\s)|$))/u
    : /(\*\*[^*]+\*\*|\([^)]*\)|“[^”]*”|"[^"\n]*"|\n+|[^.!?…:\n(“"*]+(?:[.!?…]+|:(?=\s)|$))/u;
  const parts = clean.split(re).filter(x=>x && x.trim());
  const name = (typeof nick==="function" ? nick() : "").replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu,"").trim();
  const out = [];
  let prev = fallback==="en" ? "en" : "vi";
  for(let raw of parts){
    const t = raw.replace(/\*\*/g,"").trim(); if(!t) continue;
    const latin = (t.match(/[A-Za-z]{2,}/g)||[]).length;
    // Tên "Mây" và tên bé có dấu nhưng không làm câu tiếng Anh thành tiếng Việt
    let probe = t.split("Mây").join("");
    if(name) probe = probe.split(name).join("");
    let l;
    if(VI_CHARS.test(probe)) l = "vi";
    else if(latin >= 2 || (latin >= 1 && (fallback==="en" || /^["“(]|\*\*/.test(raw)))) l = "en";
    else l = prev;            // số, ký hiệu, một từ lẻ: theo phần trước
    if(out.length && out[out.length-1].l===l) out[out.length-1].t += " " + t; else out.push({l, t});
    prev = l;
  }
  return out;
}
// Giọng tự nhiên (Azure) khi máy chủ có key và ba mẹ không tắt; lỗi thì tự quay về giọng của máy.
// Phát bằng Web Audio: iPad chỉ cho phát âm thanh sau một lần chạm, nên "mở khoá" AudioContext ở lần chạm đầu tiên.
let actx = null, asrc = null, ttsSeq = 0;
function audioCtx(){ if(!actx){ const C = window.AudioContext || window.webkitAudioContext; if(C) actx = new C(); } return actx; }
function unlockAudio(){
  const c = audioCtx(); if(!c) return;
  if(c.state==="suspended") c.resume().catch(()=>{});
  try{ const b=c.createBuffer(1,1,22050), s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(0); }catch(e){}
}
["touchend","click"].forEach(ev=>document.addEventListener(ev, unlockAudio, {passive:true}));
function stopVoice(){ ttsSeq++; if(asrc){ try{ asrc.stop(); }catch(e){} asrc=null; } try{ speechSynthesis.cancel(); }catch(e){} }
const cloudOn = () => me.tts && LS.get("cloudVoice", true);
async function cloudSpeak(chunks, rate){
  const seq = ++ttsSeq;
  const res = await fetch("/api/tts",{method:"POST", headers:{"content-type":"application/json","x-app-pin":pin},
    body:JSON.stringify({chunks, rate:(rate||.95)/.95, vi:LS.get("cloudVi",""), en:LS.get("cloudEn","")})});
  if(!res.ok) throw new Error("tts "+res.status);
  const data = await res.arrayBuffer();
  if(seq!==ttsSeq) return;               // đã có câu khác chen vào
  const c = audioCtx(); if(!c) throw new Error("no audio");
  if(c.state==="suspended") await c.resume();
  const buf = await new Promise((ok,no)=>c.decodeAudioData(data, ok, no));
  if(seq!==ttsSeq) return;
  asrc = c.createBufferSource(); asrc.buffer = buf; asrc.connect(c.destination); asrc.start(0);
}
// Expand measurement symbols before Azure/browser TTS, without changing visible maths.
function expandMeasurementUnits(text, language){
  const en=language==='en';
  const units={
    mm:en?['millimetre','millimetres']:'mi-li-mét',
    cm:en?['centimetre','centimetres']:'xen-ti-mét',
    km:en?['kilometre','kilometres']:'ki-lô-mét',
    m:en?['metre','metres']:'mét'
  };
  // Only unit symbols attached to a number; never expand standalone letters or words.
  return String(text).replace(/(\d(?:[\d., ]*\d)?)\s*(km|mm|cm|m)([²³23])?(?![\p{L}\p{N}_])/giu,(whole,amount,unit,power)=>{
    const u=units[unit.toLowerCase()];
    if(!u)return whole;
    const suffix=power==='²'||power==='2'?(en?'square ':'vuông '):power==='³'||power==='3'?(en?'cubic ':'khối '):'';
    if(en){
      const singular=/^1(?:[.,]0+)?$/.test(amount.trim());
      return amount+' '+(suffix?suffix:'')+u[singular?0:1];
    }
    return amount+' '+u+(suffix?' '+suffix.trim():'');
  });
}
function speak(text, lang, rate){
  const chunks = lang==="en-only" ? [{l:"en", t:String(text).replace(/\*\*/g,"")}]
               : lang==="vi-only" ? [{l:"vi", t:String(text).replace(/\*\*/g,"")}]
               : langChunks(text, lang);
  for(const chunk of chunks)chunk.t=expandMeasurementUnits(chunk.t,chunk.l);
  stopVoice();
  if(cloudOn()){ cloudSpeak(chunks.map(c=>({l:c.l, t:c.t.replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu,"")})), rate).catch(()=>deviceSpeak(chunks, rate)); return; }
  deviceSpeak(chunks, rate);
}
function deviceSpeak(chunks, rate){
  try{
    speechSynthesis.cancel();
    const c = voiceCfg();
    for(const ch of chunks){
      const u = new SpeechSynthesisUtterance(ch.t);
      const v = pickVoice(ch.l);
      u.lang = v ? v.lang : (ch.l==="vi" ? "vi-VN" : "en-GB");
      if(v) u.voice = v;
      u.pitch = Math.min(2, Math.max(0.5, +c.pitch||1.4));
      u.rate = Math.min(1.6, Math.max(0.5, (rate||.95) * (+c.speed||1)));
      speechSynthesis.speak(u);
    }
  }catch(e){}
}

async function sendChat(text, viaMic){
  text = (text||"").trim();
  if(!text || state.busy || !ready()) return;
  state.turns.push({role:"user",content:text});
  const reply = {role:"assistant",content:"",pending:true};
  state.turns.push(reply);
  state.busy=true; updateComposer(); drawMessages();
  const ctl = {aborted:false, abort(){ this.aborted=true; }}; state.ctl=ctl;
  try{
    const res = await api("/api/chat",{conv_id:state.convId, subject:state.subject, topic:state.topic, text, mic:!!viaMic});
    state.convId = res.conv_id; setStars(res.stars);
    if(ctl.aborted) throw {code:"cancelled"};
    reply.content = res.text || "…"; reply.pending=false;
    if(autoRead && state.view==="chat") speak(reply.content, subjById(state.subject).lang);
  }catch(e){
    reply.pending=false; reply.content = copyFor(e&&e.code) || "(Đã dừng)"; reply.err=true;
  }finally{
    state.busy=false; if(state.ctl===ctl) state.ctl=null;
    if(state.view==="chat"){ drawMessages(); updateComposer(); }
  }
}

    const msg = ok===n ? "Tuyệt vời! Đúng hết luôn!" : ok>=n-1 ? "Giỏi quá đi!" : ok>=n/2 ? "Làm tốt lắm! Cố thêm chút nữa nhé." : "Không sao cả, mình cùng ôn lại nha!";
    const wrong = Q.qs.filter((q,i)=>!Q.results[i]);
    let extra = "";
    if(review) extra = Q.mastered ? `Bạn đã thuộc hẳn ${Q.mastered} câu, Mây cất chúng khỏi sổ rồi ⭐` : "Câu đúng sẽ được hẹn ôn lại thưa dần, câu sai thì mai mình làm lại nhé.";
    else extra = (wrong.length ? "Câu sai đã được ghi vào Sổ ôn tập 📒, mai Mây sẽ đố lại nhé." : "");
    app.innerHTML = head + `<div class="qcard score">${mascot()}
      <div class="stars">${"⭐".repeat(ok)}${"☆".repeat(n-ok)}</div>
      <h2>${ok}/${n} câu đúng</h2><p>${msg}</p><p class="muted">${extra}</p>
      <div class="row" style="justify-content:center">
        ${review ? `<button class="btn primary" id="homeAgain">Về trang chính</button>` : `<button class="btn primary" id="again">Chơi lượt mới</button>`}
        ${!review && wrong.length ? `<button class="btn" id="askWrong">Hỏi Mây câu sai</button>` : ""}
      </div></div>`;
    const ag=document.getElementById("again"); if(ag) ag.onclick=startQuiz;
    const ha=document.getElementById("homeAgain"); if(ha) ha.onclick=()=>{ go("home"); refreshState(); };
    const aw=document.getElementById("askWrong");
    if(aw) aw.onclick=()=>{
      const q = wrong[0]; state.turns=[]; state.convId=null; go("chat");
      sendChat((s.lang==="vi" ? "Mình làm sai câu này, Mây giảng lại giúp mình nhé: " : "I got this one wrong, can you help me understand it? ") + q.q + " (" + q.options.join(" / ") + ")");
    };
  } else {
    const q = Q.qs[Q.i]; const done = Q.picked!==null;
    const label = review ? `Ôn lại câu ${Q.i+1}/${Q.qs.length}, môn ${esc(subjById(q.subject)?.name || "")}` : `Câu ${Q.i+1}/${Q.qs.length}`;
    app.innerHTML = head + `
      <div class="dots">${Q.qs.map((_,i)=>`<span class="${i<Q.results.length?(Q.results[i]?"ok":"no"):(i===Q.i?"now":"")}"></span>`).join("")}</div>
      <div class="qcard visual-quiz">
        <div class="quiz-progressbar" role="progressbar" aria-valuenow="${Q.i+1}" aria-valuemax="${Q.qs.length}"><span style="width:${(Q.i+1)/Q.qs.length*100}%"></span></div>
        <div class="quiz-banner">🌟 ${review?'Ôn tập':esc(s.name)} · Visual Quiz</div>
        <div class="muted">${label}</div>
        <div class="q">${fmt(q.q)}</div>
        <div class="opts">${q.options.map((o,i)=>{
          let c=""; if(done){ if(i===q.answer) c="right"; else if(i===Q.picked) c="wrong"; }
          return `<button class="opt ${c}" data-i="${i}" ${done||Q.waiting?"disabled":""}><span class="letter">${"ABCD"[i]||""}</span>${fmt(o)}</button>`;}).join("")}</div>
        ${Q.err ? `<div class="explain">${esc(Q.err)}</div>` : ""}
        ${!done&&Q.hint&&q.hint ? `<div class="explain">💡 ${fmt(q.hint)}</div>` : ""}
        ${done ? `<div class="explain"><b>${Q.picked===q.answer?"Chính xác! 🎉":"Chưa đúng rồi, xem nè:"}</b><br>${fmt(q.explain||"")}</div>` : ""}
        <div class="row">
          ${!done&&q.hint&&!Q.hint ? `<button class="btn" id="hintBtn">💡 Gợi ý</button>` : ""}
          ${done ? `<button class="btn primary" id="next">${Q.i+1<Q.qs.length?"Câu tiếp theo":"Xem kết quả"}</button>` : ""}
        </div>
      </div>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=async()=>{
      if(Q.picked!==null || Q.waiting) return;
      const picked = +b.dataset.i;
      Q.waiting=true; Q.err=""; b.classList.add("chosen");
      app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      try{
        const r = review ? await api("/api/review_answer",{id:q.id, picked}) : await api("/api/answer",{quiz_id:Q.id, index:Q.i, picked});
        q.answer = r.answer; q.explain = r.explain || "";
        Q.picked = picked; Q.results.push(!!r.right);
        if(r.mastered) Q.mastered++;
        if(r.bonus) Q.bonus = true;
        if(typeof r.due==="number") me.due = r.due;
        setStars(r.stars);
      }catch(e){ Q.err = copyFor(e&&e.code); }
      Q.waiting=false;
      if(state.view==="quiz") render();
    });
    const hb=document.getElementById("hintBtn"); if(hb) hb.onclick=()=>{ Q.hint=true; render(); };
    const nx=document.getElementById("next"); if(nx) nx.onclick=()=>{ Q.i++; Q.picked=null; Q.hint=false; Q.err=""; render(); };
  }
  document.getElementById("back").onclick=()=>{ go(backTo); if(backTo==="home") refreshState(); };
}

// Thu nhỏ ảnh ngay trên iPad (cạnh dài tối đa 1600px, JPEG) để gửi nhanh và đỡ tốn dung lượng
async function shrinkPhoto(file){
  const url = URL.createObjectURL(file);
  try{
    const img = new Image();
    await new Promise((ok,no)=>{ img.onload=ok; img.onerror=no; img.src=url; });
    const k = Math.min(1, 1600/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    const g = c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
    let q = .85, data = c.toDataURL("image/jpeg", q);
    while(data.length > 2_000_000 && q > .5){ q -= .1; data = c.toDataURL("image/jpeg", q); }
    return data;
  } finally { URL.revokeObjectURL(url); }
}

  const H = state.hw;

  if(!ready()){ H.error="Ba mẹ cần nhập mã PIN của app trong ⚙️ Cài đặt máy trước nhé."; return render(); }

async function readCheck(part, pick){

async function submitRetell(){
  const R=state.rd; if(rtRec){ try{rtRec.stop()}catch(e){} }
  const text=(R.retell||"").trim();
  if(text.length<8){ R.err="Please write a little more (2–3 sentences). · Bạn kể dài hơn một chút nhé."; return render(); }
  R.busy=true; R.err=""; render();
  try{
    const d = await api("/api/read_answer",{id:R.r.id, retell:text});
    Object.assign(R, {r:d.reading, level:d.level, change:d.level_change||0, vocab:d.vocab_added||0, phase:"done"});
  }catch(e){ R.err=copyFor(e&&e.code); }

async function submitRead(){
  const R=state.rd; R.busy=true; render();
  try{
    const d = await api("/api/read_answer",{id:R.r.id, answers:R.sel});
    Object.assign(R, {r:d.reading, level:d.level, change:d.level_change||0, vocab:d.vocab_added||0, phase:"done"});
  }catch(e){ R.err=copyFor(e&&e.code); }

}
async function startReadRec(){
  const R=state.rd; R.err=""; stopVoice();
  if(!navigator.mediaDevices || !window.MediaRecorder){ R.err="Máy này chưa ghi âm được trên trình duyệt."; return render(); }
  try{
    rdStream = await navigator.mediaDevices.getUserMedia({audio:true});
    rdChunks=[]; rdMedia = new MediaRecorder(rdStream);
    rdMedia.ondataavailable = e=>{ if(e.data && e.data.size) rdChunks.push(e.data); };
    rdMedia.onstop = ()=>{ if(rdStream){ rdStream.getTracks().forEach(t=>t.stop()); rdStream=null; }
      if(rdChunks.length && state.rd===R){ if(R.audio) URL.revokeObjectURL(R.audio); R.blob=new Blob(rdChunks,{type:rdMedia.mimeType||"audio/mp4"}); R.audio=URL.createObjectURL(R.blob); R.pron=null; }
      R.recording=false; if(state.view==="read" && state.rd===R){ render(); if(R.blob) checkReadPron(); } };
    rdMedia.start(); R.recording=true;
    clearTimeout(R.recT); R.recT=setTimeout(()=>{ if(R.recording) stopReadRec(); }, 20000);
  }catch(e){ R.err="Cần cho phép dùng micro: bấm biểu tượng ổ khoá cạnh địa chỉ web → Quyền → Micro → Cho phép, rồi thử lại."; stopReadRec(); }
  render();
}
async function checkReadPron(){
  const R=state.rd; if(!R.blob) return;
  R.pronBusy=true; render();
  try{ const audio=await toWav16k(R.blob); const d=await api("/api/read_pron",{id:R.r.id, audio}); R.pron=d.pron; }
  catch(e){ R.err = e&&e.code==="bad_audio" ? "Đoạn ghi âm ngắn quá. Bấm 🎤, đọc cả câu rồi bấm ⏹ nhé." : copyFor(e&&e.code); }
  R.pronBusy=false; if(state.view==="read" && state.rd===R) render();
}
function markWords(text, words){
  let h = esc(text);
  (words||[]).forEach(w=>{ const k=esc(w.w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); if(k) h=h.replace(new RegExp(`\\b(${k})\\b`,"i"),"<mark>$1</mark>"); });
  return h;
}

function wpMcq(i, step, q, done){

    ${res&&res.solved?`<p class="muted" style="margin:8px 0 0">${res.ok?(res.first?VI("🎉 Right first time!","Đúng ngay lần đầu!"):VI("👍 Correct!","Đúng rồi!")):VI("The right answer is green.","Đáp án đúng là ô màu xanh.")}${q.explain?` 💡 ${VI(esc(q.explain), esc(q.explain_vi||""))}`:""}</p>`:""}</div>`;
}
function renderWp(){

      : `<div class="card" style="margin:10px 0 4px;background:var(--surface-2)"><b>${VI("🗣️ Tell Mây your first step","Nói cho Mây bước đầu tiên")}</b>
        <p class="muted" style="margin:4px 0 6px">${VI("What will you do FIRST? You don't need the answer yet – just the first job and the numbers.","Việc ĐẦU TIÊN bạn sẽ làm là gì? Chưa cần ra đáp số, chỉ cần nói làm gì với số nào.")}</p>
        <div class="frame">${VI("First, I <b>[do what]</b> <b>[which numbers]</b>.","Đầu tiên mình [làm gì] [với số nào].")}<span class="muted" style="display:block;font-size:13px;margin-top:2px">${VI("Example: First, I add 25 and 30.","Ví dụ: Đầu tiên mình cộng 25 và 30.")}</span></div>
        <div class="wpchips"><span class="muted" style="font-size:13px">${VI("1. Do what?","1. Làm gì?")}</span>${WP_OPS.map((o,k)=>`<button class="chip" data-wpop="${i}:${k}" title="${esc(o.vi)}">${o.ic} ${esc(o.en)}</button>`).join("")}</div>
        <div class="wpchips"><span class="muted" style="font-size:13px">${VI("2. Which numbers?","2. Số nào?")}</span>${wpNums(p.text).map(n=>`<button class="chip" data-wpnum="${i}" data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div>
        <textarea class="field" id="wpFirst${i}" rows="2" placeholder="First, I… / Đầu tiên mình…">${esc(W.first[i]||"")}</textarea>
        <div class="row">${SR?`<button class="btn" data-wpmic="${i}">${wpRec?"⏹️ Stop":"🎤 Speak (VI)"}</button>`:""}<button class="btn primary" data-wpfirst="${i}" ${W.busy?"disabled":""}>${W.busy?"Mây is reading…":"Send ✅"}</button></div></div>`);
    const ansHtml = p.ans===undefined ? "" : `<div style="margin-top:10px"><b>${VI("✏️ Solve it and type the answer","Tự giải rồi gõ đáp số")}</b>

        <ol style="margin:6px 0 0;padding-left:22px">${p.solution.map((x,k)=>`<li>${VI(esc(x), esc((p.solution_vi||[])[k]||""))}</li>`).join("")}</ol></div>`;

          :`<p class="muted" style="margin:6px 0 0">${VI("For each problem: find what the question asks → choose the calculation → say your first step → solve it.","Mỗi bài: tìm đề hỏi gì → chọn phép tính → nói bước đầu tiên → tự giải.")}</p>`}
    ${probs}${locked}

  wireBack();
  app.querySelectorAll("[data-wp]").forEach(b=>b.onclick=()=>wpCall("/api/wp_check",{prob:+b.dataset.wp, step:b.dataset.step, pick:+b.dataset.o}));
  app.querySelectorAll("[data-wpl]").forEach(b=>b.onclick=()=>speak(r.problems[+b.dataset.wpl].text,"en-only",.85));
  app.querySelectorAll("textarea[id^=wpFirst]").forEach(t=>t.oninput=e=>{ W.first[+t.id.slice(7)]=e.target.value; });
  app.querySelectorAll("input[id^=wpVal]").forEach(t=>{ t.oninput=e=>{ W.val[+t.id.slice(5)]=e.target.value; }; t.onkeydown=e=>{ if(e.key==="Enter") wpCall("/api/wp_answer",{prob:+t.id.slice(5), value:t.value}); }; });
  app.querySelectorAll("[data-wpfirst]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.wpfirst; if(wpRec){ try{wpRec.stop()}catch(e){} }
    const t=(W.first[i]||"").trim(); if(t.length<4){ W.err="Please write a little more. · Viết dài hơn một chút nhé."; return render(); } wpCall("/api/wp_first",{prob:i, text:t}); });
  app.querySelectorAll("[data-wpop]").forEach(b=>b.onclick=()=>{ const [i,k]=b.dataset.wpop.split(":").map(Number);
    W.first[i] = "First, I " + WP_OPS[k].en + " "; const t=document.getElementById("wpFirst"+i); if(t){ t.value=W.first[i]; t.focus(); } });
  app.querySelectorAll("[data-wpnum]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.wpnum; let v=(W.first[i]||"").replace(/\s+$/,"");
    if(!v) v="First, I"; v += /\d$/.test(v) ? " and " + b.dataset.n : " " + b.dataset.n;
    W.first[i]=v; const t=document.getElementById("wpFirst"+i); if(t) t.value=v; });
  app.querySelectorAll("[data-wpchk]").forEach(c=>c.onchange=()=>{ const [i,k]=c.dataset.wpchk.split(":").map(Number); (W.chk[i]=W.chk[i]||{})[k]=c.checked;
    const b=app.querySelector(`[data-wpans="${i}"]`); if(b) b.disabled = W.busy || !WP_CHECK.every((x,j)=>W.chk[i][j]); });
  app.querySelectorAll("[data-wpans]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.wpans; wpCall("/api/wp_answer",{prob:i, value:W.val[i]||""}); });
  app.querySelectorAll("[data-wpmic]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.wpmic;
    if(wpRec){ try{wpRec.stop()}catch(e){} return; }

    const base=(W.first[i]||"").trim();

    wpRec.onend = ()=>{ wpRec=null; if(state.view==="wp") render(); };
    try{ wpRec.start(); }catch(e){ wpRec=null; }
    render();
  });
  const on=(id,f)=>{ const el=document.getElementById(id); if(el) el.onclick=f; };
  on("wpNew", ()=>openWp(true));
  on("wpHome", ()=>{ go("home"); refreshState(); });
}

let tvRec = null;

async function loadTvw(isNew){

}
async function tvCall(path, body){
  const T=state.tv; if(T.busy) return; T.busy=true; T.err=""; render();
  try{ const d = await api(path, {id:T.r.id, ...body}); T.r=d.tvw; }catch(e){ T.err=copyFor(e&&e.code); }
  T.busy=false; if(state.view==="tvw" && state.tv===T) render();
}

/* ---------- Nghe tiếng Anh (Listening) ---------- */
// Bé nghe (không thấy chữ), đọc trước 4 câu hỏi, trả lời, rồi nghe và chép 1 câu. Nộp xong mới hiện lời thoại.
function openListen(isNew){
  state.ls = {phase:"loading", err:"", sel:[], typed:"", plays:0, dplays:0};
  go("listen");
  loadListen(!!isNew);
}
async function loadListen(isNew){
  const L=state.ls;
  try{
    const d = await api("/api/listen_start", isNew?{new:1}:{});
    if(state.ls!==L) return;
    Object.assign(L, {r:d.listening, level:d.level, phase: d.listening.score!==null ? "done" : "listen", sel: d.listening.answers || []});
  }catch(e){ L.phase="error"; L.err=copyFor(e&&e.code); }
  if(state.view==="listen" && state.ls===L) render();
}
// Phát âm thanh bài nghe từ máy chủ (giữ trong bộ nhớ để nghe lại không phải tải lại)
const lsCache = {};
async function playListen(part, slow){
  const L=state.ls, key=L.r.id+":"+part+":"+(slow?1:0);
  stopVoice(); const seq=++ttsSeq;
  L.loadingAudio=true; render();
  try{
    let data = lsCache[key];
    if(!data){
      const res = await fetch("/api/listen_audio",{method:"POST", headers:{"content-type":"application/json","x-app-pin":pin}, body:JSON.stringify({id:L.r.id, part, slow:slow?1:0})});
      if(!res.ok) throw new Error("audio "+res.status);
      data = lsCache[key] = await res.arrayBuffer();
    }
    const c = audioCtx(); if(c.state==="suspended") await c.resume();
    const buf = await new Promise((ok,no)=>c.decodeAudioData(data.slice(0), ok, no));
    if(seq!==ttsSeq) return;
    asrc = c.createBufferSource(); asrc.buffer = buf; asrc.connect(c.destination); asrc.start(0);
    if(part==="all") L.plays++; else L.dplays++;
  }catch(e){ L.err="Mây can't play the audio now. Please try again."; }
  L.loadingAudio=false; if(state.view==="listen" && state.ls===L) render();
}
async function submitListen(){
  const L=state.ls; L.busy=true; stopVoice(); render();
  try{
    const d = await api("/api/listen_answer",{id:L.r.id, answers:L.sel, typed:L.typed});
    Object.assign(L, {r:d.listening, level:d.level, change:d.level_change||0, phase:"done"});
  }catch(e){ L.err=copyFor(e&&e.code); }
  L.busy=false; if(state.view==="listen" && state.ls===L){ render(); window.scrollTo(0,0); }
}

      <div class="row"><button class="btn primary" id="lsPlay" ${dis}>▶️ Listen</button><button class="btn" id="lsSlow" ${dis}>🐢 Slow</button><button class="btn" id="lsStop">⏹</button></div>

      ${done ? `<p lang="en" style="font-size:19px">${(r.dict?.words||[]).map(w=>`<span class="dw ${w.ok?"ok":"no"}">${esc(w.w)}</span>`).join(" ")}</p>
                <p class="muted" style="margin:0">You wrote: <span lang="en">${esc(r.typed||"")}</span> · ${r.dict?.right||0}/${r.dict?.total||0} words right ${r.dict?.pass?"✅":""}</p>`
             : `<input class="field" id="lsTyped" lang="en" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Write what you hear…" value="${esc(L.typed)}">`}
    </div>

    ${done?`<div class="row" style="margin-top:12px"><button class="btn" id="lsNew">🎧 Another task</button><button class="btn primary" id="lsHome">Finish 🏠</button></div>`
          :`<button class="btn primary" id="lsSubmit" ${!ready||L.busy?"disabled":""}>${L.busy?"Mây is checking…":"Submit ✅"}</button>`}`;

const IPA_LESSONS=[
 {a:"/iː/",b:"/ɪ/",name:"Âm dài và âm ngắn",pairs:[["sheep","ship"],["leave","live"],["seat","sit"]],tips:["Âm /iː/: môi kéo nhẹ sang hai bên, giữ âm lâu hơn.","Âm /ɪ/: thả lỏng hơn, âm ngắn."]},

let ipaState={lesson:0,pair:0,answer:null,checked:false,target:Math.floor(Math.random()*2)};
// Simplified teaching diagram (front-facing lips, teeth, tongue), not an anatomical scan.
function ipaMouthDiagram(phoneme){
 const shape={
 '/iː/':{rx:72,ry:15,tongue:0,teeth:1,caption:'Môi kéo rộng · âm dài'},
 '/ɪ/':{rx:57,ry:19,tongue:0,teeth:1,caption:'Môi thả lỏng · âm ngắn'},
 '/e/':{rx:59,ry:27,tongue:0,teeth:1,caption:'Mở miệng vừa'},
 '/æ/':{rx:61,ry:40,tongue:0,teeth:1,caption:'Hạ hàm · mở rộng'},
 '/θ/':{rx:49,ry:21,tongue:1,teeth:1,caption:'Đầu lưỡi giữa hai hàm răng'},
 '/ð/':{rx:49,ry:21,tongue:1,teeth:1,caption:'Đầu lưỡi giữa răng · có rung'},
 '/ʃ/':{rx:32,ry:24,tongue:0,teeth:0,caption:'Môi hơi tròn · hơi kéo dài'},
 '/tʃ/':{rx:36,ry:25,tongue:0,teeth:0,caption:'Bật âm rồi xì hơi'}
 }[phoneme];
 if(!shape)return '';
 const rx=shape.rx,ry=shape.ry;
 const teeth=shape.teeth?'<path d="M '+(110-rx+7)+' 111 Q 110 '+(109-ry/2)+' '+(110+rx-7)+' 111 L '+(110+rx-11)+' 119 Q 110 125 '+(110-rx+11)+' 119 Z" fill="#fff" stroke="#E2D9D9" stroke-width="1.4"/>':'';
 const tongue=shape.tongue?'<ellipse cx="110" cy="120" rx="31" ry="12" fill="#E97987" stroke="#A93E55" stroke-width="2"/>':'<path d="M 77 135 Q 110 120 143 135" stroke="#C75E70" stroke-width="5" fill="none" stroke-linecap="round"/>';
 return '<div class="ipa-mouth-card"><svg viewBox="0 0 220 192" role="img" aria-label="Hình minh họa khẩu hình cho âm '+esc(phoneme)+'" xmlns="http://www.w3.org/2000/svg">'+
 '<ellipse cx="110" cy="92" rx="88" ry="87" fill="#F6C6A9" stroke="#C98F76" stroke-width="2"/>'+
 '<path d="M 58 65 Q 77 55 96 66 M 124 66 Q 143 55 162 65" stroke="#805448" stroke-width="4" fill="none" stroke-linecap="round"/>'+
 '<circle cx="78" cy="77" r="5" fill="#523B3D"/><circle cx="142" cy="77" r="5" fill="#523B3D"/>'+
 '<path d="M 110 83 Q 99 99 110 101" fill="none" stroke="#C98F76" stroke-width="3"/>'+
 '<ellipse cx="110" cy="120" rx="'+(rx+8)+'" ry="'+(ry+8)+'" fill="#B94D64"/>'+
 '<ellipse cx="110" cy="120" rx="'+rx+'" ry="'+ry+'" fill="#592A3A"/>'+teeth+tongue+
 '</svg><strong>'+esc(phoneme)+'</strong><small>'+esc(shape.caption)+'</small></div>';
}

function openSpeak(type, topic){
  state.sp = {type:type||null, topic:topic||"", phase: type ? "loading" : "setup"};
  go("speak");
  if(type) startSpeakSession(type);
}
async function startSpeakSession(type){
  const S = state.sp; S.type=type; S.phase="loading"; S.err=""; render();
  try{
    const d = await api("/api/speak_start",{type, topic:S.topic});
    if(state.sp!==S) return;
    Object.assign(S, {sid:d.session_id, items:d.items, i:0, phase:"item", res:{}, tries:{}, live:"", showVi:false, audio:{}, blob:{}, pron:{}});
    sayPrompt();
  }catch(e){ S.phase="setup"; S.err=copyFor(e&&e.code); }
  if(state.view==="speak") render();
}
function curItem(){ const S=state.sp; return S.items[S.i]; }
function sayPrompt(){
  const S=state.sp, it=curItem(); if(!it) return;
  if(S.type==="answer") speak(it.q,"en-only",.9);
  else if(S.type==="tell") speak(it.topic,"en-only",.9);
}
function stopSpeakCapture(abort){
  if(spRec){ try{ abort ? spRec.abort() : spRec.stop(); }catch(e){} if(abort) spRec=null; }
  if(spMedia && spMedia.state!=="inactive"){ try{ spMedia.stop(); }catch(e){} }
  if(abort && spStream){ spStream.getTracks().forEach(t=>t.stop()); spStream=null; }
}
// Android: micro chỉ cho một bên dùng, ghi âm song song làm phần nhận giọng không nghe được → không ghi âm trên Android
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const canRecordAlong = () => !IS_ANDROID && LS.get("recAudio", true) && navigator.mediaDevices && window.MediaRecorder;
function startSpeakCapture(){
  const S=state.sp; const idx=S.i;
  stopVoice();
  S.live=""; S.note=""; S.res[idx]=null; S.listening=true;
  let finalText="", heard=false;
  // Bật nhận giọng NGAY trong lần bấm (trước mọi việc khác) để trình duyệt cho dùng micro
  try{
    spRec = new SR(); spRec.lang="en-US"; spRec.interimResults=true; spRec.continuous = S.type==="tell" && !IS_ANDROID; spRec.maxAlternatives=1;
  }catch(e){ spRec=null; S.listening=false; S.note="Máy này chưa nghe trực tiếp được. Bạn bấm vào ô bên dưới và dùng micro trên bàn phím nhé."; render(); return; }
  spRec.onresult = ev=>{ heard=true; let interim=""; for(let i=ev.resultIndex;i<ev.results.length;i++){ const r=ev.results[i]; if(r.isFinal) finalText+=(finalText?" ":"")+r[0].transcript.trim(); else interim+=r[0].transcript; }
    S.live=(finalText+" "+interim).trim(); const el=document.getElementById("spLive"); if(el) el.textContent=S.live||"…"; };
  spRec.onerror = ev=>{
    if(spMedia && (ev.error==="audio-capture"||ev.error==="not-allowed"||ev.error==="service-not-allowed")){
      LS.set("recAudio", false); S.note="Mây tắt phần ghi âm để nghe bạn rõ hơn. Bấm 🎤 nói lại nhé.";
    } else S.note = {"not-allowed":"Cần cho phép dùng micro: bấm biểu tượng ổ khoá cạnh địa chỉ web → Quyền → Micro → Cho phép, rồi thử lại.",
      "service-not-allowed":"Trình duyệt chưa cho nhận giọng nói ở đây. Bạn dùng micro trên bàn phím để nói nhé.",
      "no-speech":"Mây chưa nghe thấy gì. Bấm 🎤, nói to và rõ, nói xong dừng lại một chút nhé.",
      "audio-capture":"Không dùng được micro (có thể app khác đang dùng). Đóng app khác rồi thử lại nhé.",
      "network":"Mạng chập chờn nên Mây chưa nghe được. Thử lại nhé."}[ev.error] || (ev.error==="aborted"?"":"Mây nghe chưa rõ. Thử lại nhé.");
  };
  spRec.onend = ()=>{ spRec=null; S.listening=false; if(spMedia && spMedia.state!=="inactive"){ try{spMedia.stop();}catch(e){} }
    const t=(finalText||S.live||"").trim();
    if(t && state.sp===S && S.i===idx) return checkSpeak(t);
    if(!S.note) S.note = heard ? "Mây nghe chưa rõ. Bấm 🎤 nói lại nhé." : "Mây chưa nghe thấy gì. Bấm 🎤, nói to và rõ, nói xong dừng lại một chút nhé.";
    if(state.view==="speak") render(); };
  spRec.onstart = ()=>{ if(canRecordAlong()) startRecordAlong(S, idx); };
  try{ spRec.start(); }catch(e){ spRec=null; S.listening=false; S.note="Mây chưa bật được micro. Thử lại nhé."; }
  render();
}
// Ghi âm để bé nghe lại giọng mình (chỉ trên máy, không gửi đi); máy không cho thì bỏ qua
async function startRecordAlong(S, idx){
  spChunks=[];
  try{
    spStream = await navigator.mediaDevices.getUserMedia({audio:true});
    if(!S.listening){ spStream.getTracks().forEach(t=>t.stop()); spStream=null; return; }
    spMedia = new MediaRecorder(spStream);
    spMedia.ondataavailable = e=>{ if(e.data && e.data.size) spChunks.push(e.data); };
    spMedia.onstop = ()=>{ if(spChunks.length){ const old=S.audio[idx]; if(old) URL.revokeObjectURL(old); const blob=new Blob(spChunks,{type:spMedia.mimeType||"audio/mp4"});
        S.audio[idx]=URL.createObjectURL(blob); S.blob[idx]=blob; S.pron[idx]=null; }
      if(spStream){ spStream.getTracks().forEach(t=>t.stop()); spStream=null; } if(state.view==="speak") render(); };
    spMedia.start();
  }catch(e){ spMedia=null; if(spStream){ spStream.getTracks().forEach(t=>t.stop()); spStream=null; } }
}
// Chuyển ghi âm của máy (mp4/webm) thành WAV 16 kHz mono để gửi Mây nghe phát âm (tối đa 50 giây)
async function toWav16k(blob){
  const C = window.AudioContext || window.webkitAudioContext;
  const ctx = audioCtx() || new C();
  const data = await blob.arrayBuffer();
  const src = await new Promise((ok,no)=>ctx.decodeAudioData(data, ok, no));
  const secs = Math.min(src.duration, 50), rate = 16000;
  const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(secs*rate)), rate);
  const node = off.createBufferSource(); node.buffer = src; node.connect(off.destination); node.start(0);
  const pcm = (await off.startRendering()).getChannelData(0);
  const buf = new ArrayBuffer(44 + pcm.length*2), v = new DataView(buf);
  const w = (o,str)=>{ for(let i=0;i<str.length;i++) v.setUint8(o+i, str.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4, 36+pcm.length*2, true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,pcm.length*2,true);
  for(let i=0;i<pcm.length;i++){ const x=Math.max(-1,Math.min(1,pcm[i])); v.setInt16(44+i*2, x<0?x*0x8000:x*0x7fff, true); }
  let bin=""; const u8=new Uint8Array(buf); for(let i=0;i<u8.length;i+=0x8000) bin+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000));
  return btoa(bin);
}
async function checkPron(){
  const S=state.sp, idx=S.i, blob=S.blob[idx]; if(!blob) return;
  S.pronBusy=true; S.note=""; render();
  try{
    const audio = await toWav16k(blob);
    const d = await api("/api/speak_pron",{session_id:S.sid, index:idx, audio, transcript:S.live||""});
    S.pron[idx]=d.pron;
  }catch(e){ S.note = e&&e.code==="bad_audio" ? "Đoạn ghi âm ngắn quá hoặc bị lỗi. Bấm 🎤 nói lại nhé." : (e&&e.code==="upstream" ? "Mây chưa nghe được lúc này. Thử lại sau ít phút nhé." : copyFor(e&&e.code)); }
  S.pronBusy=false; if(state.view==="speak" && state.sp===S) render();
}
const PRON_LV = {great:"🌟 Phát âm rất chuẩn!", good:"👍 Phát âm khá tốt", try_again:"💪 Luyện thêm vài âm nhé", unclear:"🤔 Mây nghe chưa rõ"};
function pronHtml(p){
  if(!p) return "";
  return `<div class="pron"><div class="lv ${p.overall==="unclear"?"try_again":p.overall}">${PRON_LV[p.overall]||""}</div>
    ${p.overall==="unclear"?`<p class="muted">Ghi âm nhỏ hoặc có tiếng ồn. Bạn nói to, rõ, gần iPad hơn rồi thử lại nhé.</p>`:`
    <div style="margin:6px 0">${p.words.map((w,i)=>`<button class="wd pw ${w.s}" data-pw="${i}" title="${esc(w.tip||"")}">${esc(w.w)}</button>`).join(" ")}</div>
    <div class="muted" style="font-size:13px">Xanh: chuẩn · Vàng: chỉnh nhẹ · Đỏ: cần luyện. Chạm vào từ để nghe mẫu.</div>
    ${p.words.filter(w=>w.s!=="good"&&w.tip).slice(0,4).map(w=>`<div class="fix"><b>${esc(w.w)}</b>: ${esc(w.tip)}</div>`).join("")}
    ${p.sounds.map(x=>`<div class="fix">🔤 <b>${esc(x.sound)}</b>${x.words.length?` (${x.words.map(esc).join(", ")})`:""}: ${esc(x.tip)}</div>`).join("")}
    ${p.praise?`<p style="margin:8px 0 4px">${esc(p.praise)}</p>`:""}
    ${p.next?`<p class="muted" style="margin:4px 0">💡 ${esc(p.next)}</p>`:""}`}</div>`;
}
async function checkSpeak(text){
  const S=state.sp, idx=S.i;
  S.checking=true; S.live=text; render();
  try{ const d = await api("/api/speak_check",{session_id:S.sid, index:idx, transcript:text}); S.res[idx]=d.result; S.tries[idx]=(S.tries[idx]||0)+1; setStars(d.stars); }
  catch(e){ S.note=copyFor(e&&e.code); }
  S.checking=false; if(state.view==="speak" && state.sp===S) render();
}

  const head = `<button class="back" id="back">‹ English</button>
    <div class="sec-title"><div class="badge" style="background:var(--l4)">🗣️</div><div><h2>Luyện nói</h2><div class="muted">Speaking${S.topic?" – "+esc(S.topic):""}</div></div></div>`;

  if(S.phase==="setup"){

      <div class="row" style="justify-content:center"><button class="btn primary" id="spAgain">Luyện kiểu khác</button><button class="btn" id="spHome">Về trang chính</button></div></div>`
      : `<div class="qcard score">${mascot()}<h2>Bạn chưa nói câu nào</h2>
      <p>Mỗi câu, bạn bấm nút 🎤 rồi nói to, rõ. Khi Mây nghe được, chữ sẽ hiện trong ô bên dưới nút 🎤 và Mây sẽ chấm.</p>
      <p class="muted">Nếu bấm 🎤 mà không thấy chữ hiện ra, hãy cho phép trình duyệt dùng micro, hoặc gõ/đọc chính tả câu đó vào ô.</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="spRedo">Luyện lại từ đầu</button><button class="btn" id="spHome">Về trang chính</button></div></div>`;
  } else {
    const it=curItem(), r=S.res[S.i], t=SP_TYPES[S.type];
    let prompt="";
    if(S.type==="read") prompt = `<div class="muted">${t.ic} Đọc to câu này</div><div class="sp-big">${esc(it.text)}</div>`;
    else if(S.type==="answer") prompt = `<div class="muted">${t.ic} Mây hỏi, bạn trả lời bằng tiếng Anh</div><div class="sp-big">${esc(it.q)}</div>
      ${it.hints?.length?`<div class="chips">${it.hints.map(h=>`<span class="chip">${esc(h)}</span>`).join("")}</div>`:""}`;
    else prompt = `<div class="muted">${t.ic} Kể hoặc miêu tả 3–5 câu</div><div class="sp-big">${esc(it.topic)}</div>
      <ul class="weak">${(it.guide||[]).map(g=>`<li>${esc(g)}</li>`).join("")}</ul>
      ${it.words?.length?`<div class="chips">${it.words.map(h=>`<span class="chip">${esc(h)}</span>`).join("")}</div>`:""}`;
    const modelText = S.type==="read" ? it.text : (r ? it.sample : "");
    body = `<div class="dots">${S.items.map((_,i)=>`<span class="${S.res[i]?(S.res[i].level==="try_again"?"no":"ok"):(i===S.i?"now":"")}"></span>`).join("")}</div>

          ${!S.showVi?`<button class="btn" id="spVi">Nghĩa là gì?</button>`:""}
        </div>

          <div class="sp-live" id="spLive">${esc(S.live||"")||"&nbsp;"}</div>`
        : `<p class="muted">Bấm vào ô dưới, chọn 🎤 trên bàn phím để nói (đọc chính tả tiếng Anh), rồi bấm Gửi.</p>
          <textarea class="field" id="spText" rows="2" placeholder="Bạn nói gì sẽ hiện ở đây…">${esc(S.live||"")}</textarea>

        ${S.note?`<div class="pnote">${esc(S.note)}</div>`:""}
        ${r ? `<div class="sp-res"><div class="lv ${r.level}">${LEVELS[r.level]}</div>
          ${r.diff?`<div style="margin:6px 0">${r.diff.words.map(w=>`<span class="wd ${w.ok?"ok":"no"}">${esc(w.w)}</span>`).join(" ")}</div>
            <div class="muted">Mây nghe được ${r.diff.matched}/${r.diff.total} từ${r.diff.missed.length?". Từ gạch đỏ: Mây chưa nghe rõ, đọc chậm và rõ hơn nhé":""}.</div>`:""}
          ${r.praise?`<p style="margin:8px 0 4px">${esc(r.praise)}</p>`:""}
          ${r.fixes.map(f=>`<div class="fix">${f.said?`<s>${esc(f.said)}</s> → `:""}<b>${esc(f.better)}</b>${f.why?`<br><span class="muted">${esc(f.why)}</span>`:""}</div>`).join("")}
          ${r.tip?`<p class="muted" style="margin:6px 0">💡 ${esc(r.tip)}</p>`:""}
          ${r.say_it && S.type!=="read"?`<p style="margin:8px 0 0">Nói lại thử: <b>${esc(r.say_it)}</b> <button class="speak" id="spSayIt">🔊</button></p>`:""}
          ${modelText && S.type!=="read"?`<p class="muted" style="margin:8px 0 0">Câu mẫu: ${esc(modelText)} <button class="speak" id="spSample">🔊</button></p>`:""}
          ${S.audio[S.i]?`<div style="margin-top:10px"><div class="muted">🎧 Giọng của bạn:</div><audio controls src="${S.audio[S.i]}" style="width:100%"></audio></div>`:""}
          ${me.pron && S.blob[S.i] && !S.pron[S.i] ? `<div class="row"><button class="btn primary" id="spPron" ${S.pronBusy?"disabled":""}>${S.pronBusy?"Mây đang nghe phát âm…":"👂 Mây nghe phát âm"}</button></div>` : ""}
          ${pronHtml(S.pron[S.i])}
        </div>` : ""}
        <div class="row">
          ${r?`<button class="btn" id="spRetry">🔁 Nói lại</button>`:""}
          <button class="btn ${r?"primary":""}" id="spNext">${S.i+1<S.items.length?"Câu tiếp ›":"Xem kết quả"}</button>
        </div>
      </div>`;
  }
  app.innerHTML = head + body;
  document.getElementById("back").onclick=()=>{ state.subject="ceng"; go("subject"); };
  app.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>startSpeakSession(b.dataset.sp));
  const on=(id,f)=>{ const el=document.getElementById(id); if(el) el.onclick=f; };
  const it = S.items?.[S.i];
  on("spModel",()=>speak(it.text,"en-only",.9)); on("spSlow",()=>speak(it.text,"en-only",.6)); on("spAsk",sayPrompt);
  on("spVi",()=>{ S.showVi=true; render(); });
  on("spMic",()=>{ if(S.listening) stopSpeakCapture(false); else startSpeakCapture(); });
  on("spSend",()=>{ const v=document.getElementById("spText").value.trim(); if(v) checkSpeak(v); });
  on("spSayIt",()=>speak(S.res[S.i].say_it,"en-only",.9)); on("spSample",()=>speak(it.sample,"en-only",.9));
  on("spPron",checkPron);
  app.querySelectorAll("[data-pw]").forEach(b=>b.onclick=()=>speak(S.pron[S.i].words[+b.dataset.pw].w,"en-only",.75));
  on("spRetry",()=>{ S.res[S.i]=null; S.live=""; S.note=""; render(); });
  on("spNext",()=>{ stopSpeakCapture(true); if(S.i+1<S.items.length){ S.i++; S.live=""; S.note=""; S.showVi=false; render(); sayPrompt(); } else { S.phase="done"; render(); } });
  on("spAgain",()=>{ S.phase="setup"; render(); });
  on("spRedo",()=>{ Object.assign(S,{phase:"item", i:0, live:"", note:"", showVi:false}); render(); sayPrompt(); });
  on("spHome",()=>{ go("home"); refreshState(); });
}

function wrLeft(W){ return W.started_at ? Math.max(0, W.started_at + W.minutes*60 - Math.floor(Date.now()/1000) + (W.skew||0)) : W.minutes*60; }
function wrClock(sec){ const m=Math.floor(sec/60), x=sec%60; return `${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`; }
function wrDictate(inputId, lang, btn){
  if(wrRec){ try{wrRec.stop()}catch(e){} return; }
  if(!SR){ alert("Máy này chưa nói trực tiếp được. Bấm micro trên bàn phím để nói nhé."); return; }
  const inp=document.getElementById(inputId); stopVoice();
  try{ wrRec=new SR(); wrRec.lang = lang==="en" ? "en-GB" : "vi-VN"; wrRec.interimResults=true; wrRec.continuous=false; }catch(e){ wrRec=null; return; }
  const base = inp.value ? inp.value.trim()+" " : ""; let fin="";
  btn.classList.add("on");
  wrRec.onresult=ev=>{ let it=""; for(let i=ev.resultIndex;i<ev.results.length;i++){ const r=ev.results[i]; if(r.isFinal) fin+=r[0].transcript; else it+=r[0].transcript; } inp.value=(base+fin+it).trim(); inp.dispatchEvent(new Event("input")); };
  wrRec.onend=()=>{ wrRec=null; btn.classList.remove("on"); };
  wrRec.onerror=()=>{};
  try{ wrRec.start(); }catch(e){ wrRec=null; btn.classList.remove("on"); }
}
async function wrCall(path, body, phaseWhile){
  const R = state.wr; R.busy = phaseWhile; R.err=""; render();
  try{ const d = await api(path, body); if(d.writing){ d.writing.skew = d.writing.now - Math.floor(Date.now()/1000); R.w = d.writing; } if(d.stars!==undefined) setStars(d.stars); return d; }

  finally{ R.busy=null; if(state.view==="write" && state.wr===R) render(); }
}
function writingMapSvg(prompt, branches, foot){
 const colors=['#518AC9','#379A76','#9E75C5','#C68E2B'];
 const pos=[{x:245,y:92},{x:755,y:92},{x:245,y:670},{x:755,y:670}];
 const e=x=>esc(String(x||''));
 const lines=(v,max=34)=>{let out=[],cur='';for(const w of String(v||'').split(/\s+/)){if((cur+' '+w).trim().length>max&&cur){out.push(cur);cur=w}else cur=(cur+' '+w).trim()}if(cur)out.push(cur);return out.slice(0,2)};
 let out='<svg class="writing-svg" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sơ đồ tư duy bốn nhánh" xmlns="http://www.w3.org/2000/svg">';
 branches.forEach((b,i)=>{
  const p=pos[i],c=colors[i],top=i<2,left=i%2===0;
  const x1=left?405:595, x2=p.x, y1=top?345:425,y2=top?145:615;
  out+='<path d="M '+x1+' '+y1+' C '+x1+' '+(top?210:560)+', '+x2+' '+(top?260:500)+', '+x2+' '+y2+'" fill="none" stroke="'+c+'" stroke-width="7" stroke-linecap="round"/>';
  const items=(b[1]||[]).slice(0,3);
  items.forEach((it,j)=>{
   const yy=top?179+j*49:465+j*49, arr=lines(it,39), h=arr.length>1?45:36;
   out+='<rect x="'+(p.x-191)+'" y="'+(yy-h/2)+'" width="382" height="'+h+'" rx="12" fill="var(--surface,#fff)" stroke="'+c+'" stroke-width="2"/>';
   arr.forEach((line,k)=>out+='<text x="'+p.x+'" y="'+(yy+(k-(arr.length-1)/2)*18+6)+'" text-anchor="middle" font-size="18" fill="var(--ink,#332052)">'+e(line)+'</text>');
  });
  out+='<rect x="'+(p.x-192)+'" y="'+(p.y-39)+'" width="384" height="78" rx="22" fill="'+c+'"/>';
  out+='<text x="'+p.x+'" y="'+(p.y+9)+'" fill="white" text-anchor="middle" font-size="29" font-weight="bold">'+e(b[0])+'</text>';
 });
 out+='<rect x="355" y="325" width="290" height="115" rx="42" fill="#348D75" stroke="#26735E" stroke-width="4"/>';
 const title=lines(prompt,23);
 title.forEach((line,i)=>out+='<text x="500" y="'+(384+(i-(title.length-1)/2)*29)+'" text-anchor="middle" font-size="25" font-weight="bold" fill="white">'+e(line)+'</text>');
 out+='</svg>';
 return '<div class="writing-map" role="region" aria-label="Sơ đồ tư duy bài văn"><h3>🌱 Sơ đồ tư duy của Kem</h3><div class="writing-svg-scroll">'+out+'</div><p class="writing-note">'+e(foot)+'</p></div>';
}

// bé có thể bấm "Đổi việc khác" để chọn việc khác chưa làm. Danh sách đầy đủ vẫn có ở 📅 Lịch học.
function focusIndex(day){
  // Bé đã vuốt tới việc nào thì giữ việc đó (kể cả việc đã xong); chưa vuốt thì hiện việc chưa làm đầu tiên
  const f = state.focusIdx;
  // Việc bé chọn lúc chưa làm, nay đã xong (vừa làm xong quay về) → tự chuyển sang việc chưa làm kế tiếp
  if(f!==undefined && f>=0 && f<day.items.length && state.focusDay===day.day && !(day.items[f].done && state.focusOpenAtPick)) return f;
  const open = day.items.map((it,i)=>i).filter(i=>!day.items[i].done);
  return open.length ? open[0] : -1;
}

  return `<div class="today">

    ${it ? `<div class="focus ${st}" id="focusCard">${n>1?`<button class="farr l" id="focusPrev" aria-label="Việc trước">‹</button><button class="farr r" id="focusNext" aria-label="Việc sau">›</button>`:""}

        ${it.done && left ? `<div class="muted" style="font-size:14px">Còn ${left} việc chưa làm</div>` : ""}
        <div class="frow">

          ${!it.done && st!=="needs_help"?`<span class="tops" style="padding:0;display:inline"><button class="flink" data-op="help" data-k="${esc(it.key)}">🙋 Cần ba mẹ giúp</button></span>`:""}
        </div>
      </div>`
      : (n ? `<div class="focus done" id="focusCard">${n>1?`<button class="farr l" id="focusPrev" aria-label="Việc trước">‹</button><button class="farr r" id="focusNext" aria-label="Việc sau">›</button>`:""}<div class="fic">🎉</div><div class="ftt">Xong hết việc hôm nay rồi!</div><div class="muted">Giỏi quá ${esc(nick())} ơi. Nghỉ ngơi thôi nào 🌙</div></div>` : "")}
  </div>`;
}
function wireTasks(day){
  if(!day) return;
  // Đổi việc: vuốt ngang thẻ (hoặc bấm ‹ ›) để sang việc chưa làm trước/sau (vòng lại)
  const move = d => { const n=day.items.length; if(n<2) return; const cur=focusIndex(day);
    state.focusIdx = cur<0 ? (d>0 ? 0 : n-1) : (cur+d+n)%n; state.focusDay = day.day; state.focusOpenAtPick = !day.items[state.focusIdx].done; state.focusAnim = d>0 ? "in-r" : "in-l"; render(); };
  const fp=document.getElementById("focusPrev"), fn=document.getElementById("focusNext"), fc=document.getElementById("focusCard");
  if(fp) fp.onclick=()=>move(-1); if(fn) fn.onclick=()=>move(1);
  if(fc){
    if(state.focusAnim){ fc.classList.add(state.focusAnim); state.focusAnim=null; }
    let x0=null, y0=null;
    fc.addEventListener("touchstart", e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
    fc.addEventListener("touchend", e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
      if(Math.abs(dx)>50 && Math.abs(dx)>1.5*Math.abs(dy)) move(dx<0 ? 1 : -1); }, {passive:true});
  }
  // Bé tự chọn việc nào làm trước; bấm vào là "bắt đầu" (được sao tự bắt đầu, mỗi ngày một lần)
  app.querySelectorAll(".tmain[data-i]").forEach(b=>b.onclick=async()=>{
    const it = day.items[+b.dataset.i];
    if(!it.done){ try{ const r = await api("/api/task",{key:it.key, op:"start"}); me.today = r.day; }catch(e){} }
    runAction(it.action);
  });
  app.querySelectorAll(".tops button[data-op]").forEach(b=>b.onclick=async()=>{
    let note = "";
    if(b.dataset.op==="help"){ note = prompt("Bạn cần ba mẹ giúp gì? (không bắt buộc)") ?? null; if(note===null) return; }
    try{ const r = await api("/api/task",{key:b.dataset.k, op:b.dataset.op, note}); me.today = r.day; }catch(e){ alert(copyFor(e&&e.code)); return; }
    if(state.view==="plan" && state.plan?.view==="day") state.plan.day = me.today;
    render();
  });
}
function runAction(a){
  if(!a) return;
  if(a.view==="homework") return openHomework(a.subject);
  if(a.view==="review") return startReview();
  if(a.view==="speak") return openSpeak(a.type, a.topic||"");
  if(a.view==="read") return openRead();
  if(a.view==="listen") return openListen();
  if(a.view==="wp") return openWp();
  if(a.view==="tvw") return openTvw();
  if(a.view==="sci") return openSci();
  state.subject = a.subject; state.topic = a.topic || "";
  if(a.view==="quiz") return startQuiz();
  if(a.view==="chat"){ state.turns=[]; state.convId=null;
    // Việc "Học lại phần còn yếu" / "Xem trước bài ngày mai": Mây bắt đầu luôn, bé không phải nghĩ câu hỏi.
    // Nếu bài có video ba mẹ đã duyệt, Mây gợi ý xem video trước rồi mới gửi lời mở đầu.
    const sj = subjById(a.subject), name = sj?.name || "", t = a.topic ? " – " + a.topic : "", en = sj?.lang === "en";
    state.pendingMsg = a.relearn ? (en ? `I'm not strong at ${name}${t} yet. Can you explain it simply and give me 2–3 small practice questions, please?`
                                       : `Mình còn yếu phần ${name}${t}. Mây giảng lại thật dễ hiểu rồi cho mình làm thử 2–3 bài nhỏ nhé.`)
                     : a.preview ? (en ? `Tomorrow I have ${name}${t}. Can you give me a quick preview and a few warm-up questions, please?`
                                       : `Ngày mai mình học ${name}${t}. Mây cho mình xem trước bài, hỏi mình vài câu khởi động nhé.`) : null;
    state.vidShown = null; go("chat");
  }
}
async function openPlan(tab){
  state.planTab = tab || state.planTab || "day"; state.plan = {loading:true}; go("plan");
  try{ state.plan = await api("/api/plan",{view:state.planTab}); }
  catch(e){ state.plan = {error: copyFor(e&&e.code)}; }
  if(state.view==="plan") render();
}
function statsHtml(st){
  if(!st) return "";
  const acc = (st.subjects||[]).map(x=>`<div class="acc"><span>${esc(subjById(x.subject)?.name||x.subject)}</span><div class="track"><div class="fill" style="width:${Math.round(100*x.correct/x.total)}%"></div></div><span>${Math.round(100*x.correct/x.total)}%</span></div>`).join("");
  return `<div class="statrow">
    <div class="stat"><b>${st.active_days}</b>ngày có học</div>
    <div class="stat"><b>${st.count.homework}</b>bài về nhà đã chấm</div>
    <div class="stat"><b>${st.count.quiz}</b>lượt đố vui</div>
    <div class="stat"><b>${st.count.review}</b>câu ôn lại</div>
    <div class="stat"><b>${st.count.speaking||0}</b>câu luyện nói</div>
  </div>${acc ? `<div class="muted" style="margin-top:6px">Tỉ lệ đúng (đố vui và bài về nhà):</div>${acc}` : ""}`;
}
function weekTopicsHtml(w){
  if(!w) return "";
  const rows = SUBJECTS.filter(s=>w[s.id]).map(s=>`<li>${s.ic} <b>${esc(s.name)}:</b> ${esc(w[s.id])}</li>`).join("");
  return rows || w.note ? `<ul class="weak">${rows}${w.note?`<li>📌 ${esc(w.note)}</li>`:""}</ul>` : "";
}

  let body = "";
  if(P.loading) body = `<div class="greet">${mascot()}<div class="say">Mây đang mở lịch học… <span class="thinking"><i></i><i></i><i></i></span></div></div>`;
  else if(P.error) body = `<div class="notice">${esc(P.error)}</div>`;
  else if(P.view==="day"){ body = todayCard(P.day); }
  else if(P.view==="week"){
    const today = new Date().toISOString().slice(0,10);
    body = `<p class="muted">Tuần ${ddmm(P.from)} – ${ddmm(P.to)}</p>
      ${P.topics ? `<div class="card"><h3>Tuần này ôn gì</h3>${weekTopicsHtml(P.topics)}</div>` : `<div class="notice">Ba mẹ chưa duyệt kế hoạch học, nên Mây tự chọn bài theo thời khoá biểu.</div>`}
      ${P.days.map(d=>`<div class="daycol${d.day===me.today?.day?" now":""}"><b>${esc(d.weekday)} ${ddmm(d.day)}</b>
        <ul>${d.items.map(it=>`<li>${it.done===true?"✅":it.done===false&&d.day<(me.today?.day||today)?"⬜":"▫️"} ${esc(it.title)}</li>`).join("")}</ul>
        ${d.notes.filter(n=>n.startsWith("Hôm nay có lớp")).map(n=>`<div class="pnote">📌 ${esc(n.replace("Hôm nay có","Có"))}</div>`).join("")}</div>`).join("")}
      <div class="card"><h3>Tổng kết tuần</h3>${statsHtml(P.stats)}</div>`;
  }
  else if(P.view==="month"){
    body = `<h3 style="font-size:24px;margin:6px 0">${MONTHS_VI(P.from)}</h3>
      <div class="card"><h3>Kết quả tháng này</h3>${statsHtml(P.stats)}</div>

  }
  else if(P.view==="quarter"){
    body = `<p class="muted">Từ ${ddmm(P.from)}/${P.from.slice(0,4)} đến ${ddmm(P.to)}/${P.to.slice(0,4)}</p>
      <div class="card"><h3>Kết quả từ đầu quý</h3>${statsHtml(P.stats)}</div>
      ${!P.has_plan ? `<div class="notice">Chưa có kế hoạch học đã duyệt. Ba mẹ vào Cổng ba mẹ (/parents/) → Kế hoạch học để Mây soạn nhé.</div>` : ""}
      ${P.months.map(m=>`<div class="card"><h3>${MONTHS_VI(m.month)}</h3>
        ${m.weeks.map(w=>`<p style="margin:8px 0 0"><b>Tuần ${ddmm(w.start)}</b></p>${weekTopicsHtml(w)}`).join("") || `<p class="muted">Chưa có kế hoạch.</p>`}
        ${m.stats ? `<p class="muted" style="margin:8px 0 0">Đã học ${m.stats.active_days} ngày, chấm ${m.stats.count.homework} bài về nhà, ${m.stats.count.quiz} lượt đố vui.</p>` : ""}</div>`).join("")}`;
  }
  app.innerHTML = `<button class="back" id="back">‹ Trang chính</button>

    try{ state.sched = (await api("/api/parent/schedule",{save},true)).schedule;
      msg.textContent = noDate ? `Đã lưu ✅ (bỏ qua ${noDate} kỳ kiểm tra chưa có ngày)` : "Đã lưu ✅";

/* thời khoá biểu dạng bảng: hàng = tiết (giờ), cột = ngày */
const TT_SUBJECTS = ["Toán","Tiếng Việt","Tiếng Anh","Tiếng Anh ET","Tiếng Anh LT","Math Cambridge","Science Cambridge","Khoa học",
  "Lịch sử và Địa lí","Tin học","Công nghệ","STEM","Đạo đức","Hoạt động trải nghiệm","Giáo dục thể chất","Âm nhạc","Mĩ thuật",
  "Công dân toàn cầu","Sức khoẻ toàn diện","Nghệ thuật biểu diễn","CLB"];
const TT_DEFAULT_TIMES = ["08:00 - 08:35","08:40 - 09:15","09:35 - 10:10","10:15 - 10:50","12:45 - 13:20","13:20 - 13:55","14:20 - 14:55","14:55 - 15:30","15:35 - 16:15"];
let ttEdit = null;
function ttFromSched(S){
  const g = S.grid;
  const periods = g && g.periods && g.periods.length ? [...g.periods] : [...TT_DEFAULT_TIMES];
  const cells = {};
  DAY_OPTS.forEach(([d])=>{ const row = (g && g.cells && g.cells[d]) || []; cells[d] = periods.map((_,i)=>row[i]||""); });
  return {periods, cells, weekend: [6,7].some(d=>cells[d].some(x=>x)) };
}
function ttDays(){ return DAY_OPTS.filter(([d])=>d<=5 || ttEdit.weekend); }
function ttSess(t){ const m=/^\s*(\d{1,2})[:h.]/.exec(t||""); return m ? (+m[1]<12?"Sáng":"Chiều") : ""; }
function ttDraw(){
  const days = ttDays();
  let prev = null, rows = "";
  ttEdit.periods.forEach((t,i)=>{
    const s = ttSess(t);
    if(s && s!==prev) rows += `<tr class="ttsess"><th colspan="${days.length+1}">${s}</th></tr>`;
    if(s) prev = s;
    const [t1,t2] = String(t||"").split(/\s*[-–]\s*/);
    rows += `<tr><th class="tttime"><button data-p="${i}" aria-label="Giờ tiết ${i+1}: ${esc(t||"chưa có")}">${t?`${esc(t1)}${t2?`<br>${esc(t2)}`:""}`:"+ giờ"}</button></th>
      ${days.map(([d,l])=>{ const v=ttEdit.cells[d][i]||""; return `<td><button data-d="${d}" data-i="${i}" class="${v?"":"empty"}" aria-label="${l}, tiết ${i+1}: ${esc(v||"trống")}">${esc(v)}</button></td>`; }).join("")}</tr>`;
  });
  document.getElementById("ttGrid").innerHTML = `<div class="ttwrap"><table class="tt${days.length>5?" wide":""}"><thead><tr><th class="tttime">Giờ</th>${days.map(([d,l])=>`<th>${l.replace("Chủ nhật","CN")}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
  app.querySelectorAll("#ttGrid [data-d]").forEach(btn=>btn.onclick=()=>ttPickCell(+btn.dataset.d, +btn.dataset.i));
  app.querySelectorAll("#ttGrid [data-p]").forEach(btn=>btn.onclick=()=>ttPickTime(+btn.dataset.p));
}
function ttSheet(html){
